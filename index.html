<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // Autonomous Admin Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;500;700&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background: #010409; overflow-x: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(1, 4, 9, 0.9); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.4); border-radius: 2px; }
        
        .stark-panel {
            background: rgba(0, 242, 254, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1), 0 0 20px rgba(0, 242, 254, 0.15);
            backdrop-filter: blur(10px);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }
        
        .stark-input-panel {
            background: rgba(1, 10, 20, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.6);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }
    </style>
</head>
<body class="min-h-screen w-screen overflow-x-hidden flex flex-col justify-between select-none text-[#00f2fe] m-0 p-0">

    <!-- Fundo Holográfico HUD Principal -->
    <canvas id="hudCanvas" class="fixed inset-0 z-0 w-full h-full pointer-events-none"></canvas>

    <!-- Vinheta e Máscara Cibernética -->
    <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_20%,#010409_95%)] z-10"></div>

    <!-- Header Superior Responsivo com Admin Controls -->
    <header class="relative z-20 p-4 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-none w-full max-w-7xl mx-auto">
        <!-- Telemetria do Sistema & Identidade Admin -->
        <div class="stark-panel p-3.5 flex flex-col gap-2 pointer-events-auto w-full sm:w-64">
            <div class="flex items-center justify-between">
                <span class="text-[10px] tracking-widest uppercase text-[#00f2fe] font-bold">STARK OS // ADMIN</span>
                <span class="w-2 h-2 rounded-full bg-[#00f2fe] animate-ping shadow-[0_0_8px_#00f2fe]"></span>
            </div>
            <div id="clockDisplay" class="text-lg font-orbitron font-bold text-white tracking-widest">00:00:00</div>
            <div class="text-[9px] text-cyan-400/80 tracking-wider">ADMIN USER: <strong id="adminUserLabel" class="text-white">Sr. Stark</strong></div>
        </div>

        <!-- Matriz de Agentes Internos com Controlo Total -->
        <div class="stark-panel p-3.5 flex flex-col gap-2 pointer-events-auto w-full sm:w-80">
            <div class="flex items-center justify-between text-[10px] uppercase font-bold tracking-wider">
                <span class="text-[#00f2fe]">MATRIZ DE AGENTES ADMIN</span>
                <span id="agentCountBadge" class="text-emerald-400">2 ATIVOS</span>
            </div>
            <div class="flex gap-2">
                <input type="text" id="newAgentName" placeholder="Novo Agente (ex: UI Mutch)" class="bg-black/80 text-[#00f2fe] border border-[#00f2fe]/40 rounded px-2 py-1 text-[11px] outline-none flex-grow font-mono" />
                <button id="createAgentBtn" class="bg-[#00f2fe]/20 hover:bg-[#00f2fe]/40 border border-[#00f2fe] text-white px-2.5 py-1 rounded text-[11px] font-bold transition cursor-pointer">Criar</button>
            </div>
            <div id="agentsListContainer" class="max-h-20 overflow-y-auto space-y-1 text-[10px] text-gray-300 font-mono pr-1">
                <!-- Sub-agentes injetados aqui -->
            </div>
        </div>
    </header>

    <!-- Centro: Diálogo JARVIS Voice Protocol & Módulos Dinâmicos -->
    <main class="relative z-20 flex-grow flex flex-col items-center justify-center pointer-events-none px-4 sm:px-6 py-4 my-auto gap-4 w-full max-w-4xl mx-auto">
        <div class="stark-panel px-6 py-5 text-center pointer-events-auto w-full shadow-[0_0_40px_rgba(0,242,254,0.2)]">
            <div id="protocolLabel" class="text-[10px] tracking-widest text-[#00f2fe] font-bold uppercase mb-1">JARVIS ADMIN PROTOCOL</div>
            <p id="voiceFeedback" class="text-xs sm:text-sm font-light text-gray-200 tracking-wider leading-relaxed font-mono">
                "Controlo administrativo total ativado. Dige 'Mudar nome para Sandro' ou 'Criar agente [Nome]'."
            </p>
        </div>

        <!-- Área de Trabalho Dinâmica -->
        <div id="dynamicPlatform" class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3 pointer-events-auto max-h-[30vh] overflow-y-auto pr-1">
            <div class="stark-panel p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[11px] font-bold text-[#00f2fe] uppercase tracking-wider">Painel Admin Core</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                </div>
                <p class="text-[11px] text-gray-300 font-light">Sub-agentes com permissões root para mutações de DOM e estado.</p>
            </div>
        </div>
    </main>

    <!-- Rodapé: Input de Texto e Botão de Voz -->
    <footer class="relative z-30 p-4 sm:p-8 flex justify-center pointer-events-auto w-full max-w-3xl mx-auto">
        <div class="stark-input-panel w-full p-2.5 sm:p-3 flex items-center gap-3">
            <input 
                type="text" 
                id="textInput" 
                placeholder="Insira diretiva admin (ex: 'Mudar nome para Sandro', 'Criar agente')..." 
                class="bg-transparent text-[#00f2fe] placeholder-cyan-900/60 text-xs sm:text-sm outline-none flex-grow px-3 font-tech"
            />
            <button id="micBtn" class="p-2.5 sm:p-3 bg-[#00f2fe]/15 border border-[#00f2fe]/60 hover:bg-[#00f2fe]/30 text-[#00f2fe] rounded-xl transition flex items-center justify-center group cursor-pointer shadow-[0_0_20px_rgba(0,242,254,0.4)] shrink-0" title="Ativar Microfone">
                <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Lógica de Controlo Admin Total e NLP Local -->
    <script>
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');
        const clockDisplay = document.getElementById('clockDisplay');
        const newAgentName = document.getElementById('newAgentName');
        const createAgentBtn = document.getElementById('createAgentBtn');
        const agentsListContainer = document.getElementById('agentsListContainer');
        const agentCountBadge = document.getElementById('agentCountBadge');
        const dynamicPlatform = document.getElementById('dynamicPlatform');
        const adminUserLabel = document.getElementById('adminUserLabel');

        let isListening = false;
        let speechRecognition = null;
        let speechSynth = window.speechSynthesis;
        let hudEnergy = 0;
        let angleTicker = 0;
        let currentAdminName = "Sr. Stark";

        let internalAgents = [
            { id: 1, name: "Orquestrador Root", task: "Controlo Administrativo Global" },
            { id: 2, name: "Executor de DOM", task: "Mutação Dinâmica de UI e Estado" }
        ];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        setInterval(() => {
            const now = new Date();
            clockDisplay.innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        function renderAgentsUI() {
            agentCountBadge.innerText = `${internalAgents.length} ATIVOS`;
            agentsListContainer.innerHTML = internalAgents.map(a => `
                <div class="flex justify-between items-center bg-black/60 p-1.5 rounded border border-cyan-500/20">
                    <span class="text-cyan-300 font-bold">${a.name}</span>
                    <span class="text-gray-400 text-[9px]">${a.task.substring(0, 18)}...</span>
                </div>
            `).join('');
        }
        renderAgentsUI();

        function speakJarvis(text) {
            voiceFeedback.innerText = `"${text}"`;
            if (speechSynth) {
                speechSynth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'pt-BR';
                utter.rate = 1.0;
                utter.pitch = 0.5;
                speechSynth.speak(utter);
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SR();
            speechRecognition.lang = 'pt-BR';
            speechRecognition.onresult = (e) => {
                const query = e.results[0][0].transcript;
                textInput.value = query;
                processAdminDirective(query);
            };
            speechRecognition.onend = () => stopMic();
        }

        let audioCtx = null, analyser = null, micStream = null;
        micBtn.addEventListener('click', async () => {
            if (isListening) {
                stopMic();
                return;
            }
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                const source = audioCtx.createMediaStreamSource(micStream);
                source.connect(analyser);

                isListening = true;
                micBtn.classList.add('bg-cyan-500/40', 'border-cyan-300', 'text-white', 'shadow-[0_0_25px_#00f2fe]');
                speakJarvis(`À sua escuta, ${currentAdminName}. Fale sua diretiva.`);
                if (speechRecognition) speechRecognition.start();
            } catch (err) {
                speakJarvis("Erro ao aceder aos sensores de áudio.");
            }
        });

        function stopMic() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            if (speechRecognition) { try { speechRecognition.stop(); } catch(e){} }
            isListening = false;
            hudEnergy = 0;
            micBtn.classList.remove('bg-cyan-500/40', 'border-cyan-300', 'text-white', 'shadow-[0_0_25px_#00f2fe]');
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && textInput.value.trim() !== '') {
                const val = textInput.value;
                textInput.value = '';
                processAdminDirective(val);
            }
        });

        createAgentBtn.addEventListener('click', () => {
            const name = newAgentName.value.trim();
            if (name) {
                registerNewAgent(name, "Criado via painel admin");
                newAgentName.value = '';
            }
        });

        function registerNewAgent(agentName, agentTask) {
            const cleanName = agentName.replace(/["']/g, "").trim();
            internalAgents.push({ id: internalAgents.length + 1, name: cleanName, task: agentTask });
            renderAgentsUI();
            spawnPlatformCard(`Agente: ${cleanName}`, `Operacional atribuído: ${agentTask}`);
            speakJarvis(`Sub-agente ${cleanName} instanciado com privilégios root.`);
        }

        // --- MOTOR DE PROCESSAMENTO ADMIN (TOTAL CONTROL) ---
        function processAdminDirective(directive) {
            hudEnergy = 100;
            const lower = directive.toLowerCase();
            speakJarvis(`Processando diretiva admin: "${directive}"`);

            setTimeout(() => {
                // 1. Alterar Nome de Admin (ex: "mudar nome para Sandro" ou "me chame de Sandro")
                if (lower.includes('mudar nome') || lower.includes('chame de') || lower.includes('para')) {
                    let parts = directive.split(/para|de/i);
                    if (parts[1]) {
                        currentAdminName = parts[1].trim().replace(/[.!]/g, '');
                        adminUserLabel.innerText = currentAdminName;
                        spawnPlatformCard("Perfil Atualizado", `Nome de administrador alterado para ${currentAdminName}`);
                        speakJarvis(`Entendido. A partir de agora, o senhor é o ${currentAdminName}.`);
                    } else {
                        speakJarvis("Não consegui identificar o novo nome na diretiva.");
                    }
                } 
                // 2. Criar Agente (ex: "criar agente financeiro")
                else if (lower.includes('criar agente') || lower.includes('novo agente')) {
                    let parts = directive.split(/agente/i);
                    let extractedName = parts[1] ? parts[1].trim() : `Root #${internalAgents.length + 1}`;
                    if (!extractedName || extractedName.length < 2) {
                        extractedName = `Sub-Agente #${internalAgents.length + 1}`;
                    }
                    registerNewAgent(extractedName, directive);
                } 
                // 3. Alteração Visual de DOM
                else if (lower.includes('cor') || lower.includes('vermelho') || lower.includes('estilo')) {
                    document.body.style.filter = "hue-rotate(150deg)";
                    spawnPlatformCard("Mutação Root UI", "Espectro de cores alterado com sucesso.");
                    speakJarvis("Parâmetros visuais do ecossistema modificados.");
                } 
                // 4. Ação genérica admin
                else {
                    spawnPlatformCard(`Admin Task: ${directive.substring(0, 18)}`, "Executado com privilégios root pelos sub-agentes.");
                    speakJarvis(`Diretiva executada com sucesso, ${currentAdminName}.`);
                }
            }, 1200);
        }

        function spawnPlatformCard(title, description) {
            const card = document.createElement('div');
            card.className = "stark-panel p-4 flex flex-col justify-between animate-[fadeIn_0.5s_ease-out]";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[11px] font-bold text-[#00f2fe] uppercase tracking-wider">${title}</span>
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                </div>
                <p class="text-[11px] text-gray-300 font-light">${description}</p>
                <div class="mt-3 flex justify-between items-center text-[9px] font-mono text-cyan-400/70">
                    <span>STATUS: ROOT ADMIN</span>
                    <span>MUTADO COM SUCESSO</span>
                </div>
            `;
            dynamicPlatform.prepend(card);
        }

        // Renderização 60 FPS HUD Holográfico
        function renderStarkHUD() {
            angleTicker += 0.015;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#010409';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.42;

            hudEnergy *= 0.95;

            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2fe';

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angleTicker * 0.4);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.2, 0, Math.PI * 2);
            ctx.setLineDash([10, 15, 5, 15]);
            ctx.stroke();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(centerX, centerY, (radius * 0.3) * (1 + hudEnergy * 0.002), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 242, 254, 0.25)';
            ctx.fill();
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            requestAnimationFrame(renderStarkHUD);
        }

        renderStarkHUD();
    </script>
</body>
</html>
