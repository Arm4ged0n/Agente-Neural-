<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // NextGen Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --core-idle: #0ea5e9;    /* Azul Cyber */
            --core-listen: #f97316;  /* Laranja Quente */
            --core-speak: #10b981;   /* Verde Esmeralda */
            --bg-color: #030712;     /* Preto profundo */
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.05) 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #e2e8f0;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }

        .font-mono { font-family: 'Space Mono', monospace; }

        /* ---------------------------------- */
        /* ANIMAÇÕES DO NÚCLEO (ORB)          */
        /* ---------------------------------- */
        .core-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.5s ease;
        }

        /* Anel Externo */
        .ring-1 {
            width: 100%;
            height: 100%;
            border-top-color: var(--core-color, var(--core-idle));
            border-bottom-color: var(--core-color, var(--core-idle));
            opacity: 0.3;
            animation: spin 8s linear infinite;
        }

        /* Anel Intermediário */
        .ring-2 {
            width: 80%;
            height: 80%;
            border-left-color: var(--core-color, var(--core-idle));
            border-right-color: var(--core-color, var(--core-idle));
            opacity: 0.5;
            animation: spin-reverse 5s linear infinite;
        }

        /* Núcleo Central */
        .core-center {
            width: 50%;
            height: 50%;
            background: var(--core-color, var(--core-idle));
            border-radius: 50%;
            box-shadow: 0 0 50px var(--core-color, var(--core-idle));
            opacity: 0.8;
            animation: pulse-core 3s ease-in-out infinite;
            transition: all 0.4s ease;
        }

        /* Estados do Sistema via Classes CSS */
        .state-idle { --core-color: var(--core-idle); }
        .state-listening { --core-color: var(--core-listen); }
        .state-speaking { --core-color: var(--core-speak); }

        .state-listening .core-center { animation: pulse-fast 0.8s ease-in-out infinite; }
        .state-speaking .ring-1, .state-speaking .ring-2 { animation-duration: 2s; }
        .state-speaking .core-center { animation: soundwave 1.2s ease-in-out infinite; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse-core {
            0%, 100% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        @keyframes pulse-fast {
            0%, 100% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 80px var(--core-color); }
        }
        @keyframes soundwave {
            0%, 100% { transform: scale(0.9); }
            25% { transform: scale(1.2); }
            50% { transform: scale(0.85); }
            75% { transform: scale(1.1); }
        }

        /* ---------------------------------- */
        /* UI PANELS                          */
        /* ---------------------------------- */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Overlay de Inicialização */
        #initOverlay {
            background: rgba(3, 7, 18, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        /* Efeito de digitação no log */
        .log-entry { animation: slideUp 0.3s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center justify-between">

    <!-- TELA DE INICIALIZAÇÃO (Desbloqueia o áudio do navegador) -->
    <div id="initOverlay" class="fixed inset-0 flex flex-col items-center justify-center cursor-pointer transition-opacity duration-500">
        <div class="text-4xl font-bold tracking-widest text-sky-400 mb-4 uppercase">Jarvis Core</div>
        <div class="text-sm font-mono text-slate-400 animate-pulse">CLIQUE EM QUALQUER LUGAR PARA INICIAR SISTEMAS</div>
    </div>

    <!-- HEADER: Status do Sistema -->
    <header class="w-full max-w-6xl p-6 flex justify-between items-start z-10">
        <div class="glass-panel px-6 py-3 flex flex-col gap-1">
            <div class="text-xs font-mono text-sky-400 uppercase tracking-widest">Status do Sistema</div>
            <div class="flex items-center gap-2">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></div>
                <span id="statusText" class="font-semibold text-slate-200">STANDBY</span>
            </div>
        </div>
        
        <div class="glass-panel px-6 py-3 text-right flex flex-col gap-1">
            <div class="text-xs font-mono text-slate-400 uppercase tracking-widest">Fuso Horário Local</div>
            <div id="clockDisplay" class="font-mono text-xl font-bold text-slate-200">00:00:00</div>
        </div>
    </header>

    <!-- MAIN: Núcleo Visual de Inteligência -->
    <main class="flex-1 flex flex-col items-center justify-center w-full relative z-0">
        <div id="aiCore" class="core-container state-idle">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="core-center"></div>
        </div>
        <div id="aiSubtitles" class="absolute bottom-10 text-center font-mono text-lg text-slate-300 max-w-2xl px-6 min-h-[3rem] transition-all duration-300">
            Aguardando comandos.
        </div>
    </main>

    <!-- FOOTER: Controles e Terminal -->
    <footer class="w-full max-w-6xl p-6 flex gap-6 z-10">
        
        <!-- Terminal / Logs -->
        <div class="glass-panel flex-1 h-48 flex flex-col p-4 overflow-hidden relative">
            <div class="text-[0.65rem] font-mono text-slate-500 uppercase tracking-widest border-b border-slate-700/50 pb-2 mb-2">
                Terminal de Diretivas //
            </div>
            <div id="logContainer" class="flex-1 overflow-y-auto font-mono text-xs text-slate-300 space-y-2 flex flex-col justify-end pr-2">
                <div class="text-sky-500">> Interface Neural Carregada.</div>
            </div>
        </div>

        <!-- Botão de Microfone -->
        <button id="micBtn" class="glass-panel w-48 h-48 flex flex-col items-center justify-center gap-4 group hover:bg-slate-800/60 transition-all cursor-pointer">
            <div id="micIconBox" class="w-16 h-16 rounded-full bg-sky-500/20 flex items-center justify-center border border-sky-500/50 group-hover:scale-110 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </div>
            <span id="micLabel" class="font-mono text-sm text-sky-400 uppercase tracking-widest font-bold">INICIAR VOZ</span>
        </button>
        
    </footer>

    <script>
        /* ==========================================
           1. INTERFACE E UTILIDADES
           ========================================== */
        const aiCore = document.getElementById('aiCore');
        const aiSubtitles = document.getElementById('aiSubtitles');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const logContainer = document.getElementById('logContainer');
        const micBtn = document.getElementById('micBtn');
        const micIconBox = document.getElementById('micIconBox');
        const micLabel = document.getElementById('micLabel');
        const initOverlay = document.getElementById('initOverlay');

        // Relógio
        setInterval(() => {
            const now = new Date();
            document.getElementById('clockDisplay').innerText = now.toLocaleTimeString('pt-BR');
        }, 1000);

        // Adicionar Log no Terminal
        function appendLog(sender, message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-entry flex gap-2 ${type === 'error' ? 'text-red-400' : ''}`;
            
            let senderColor = 'text-slate-500';
            if (sender === 'USER') senderColor = 'text-sky-400';
            if (sender === 'JARVIS') senderColor = 'text-emerald-400';

            div.innerHTML = `<span class="${senderColor}">[${sender}]</span> <span>${message}</span>`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Mudar Estado Visual do Núcleo
        function setCoreState(state, subtitle = "") {
            aiCore.className = `core-container state-${state}`;
            if (subtitle) aiSubtitles.innerText = subtitle;

            if (state === 'idle') {
                statusText.innerText = "STANDBY";
                statusDot.className = "w-2 h-2 rounded-full bg-sky-500 animate-pulse";
                micLabel.innerText = "INICIAR VOZ";
                micIconBox.className = "w-16 h-16 rounded-full bg-sky-500/20 flex items-center justify-center border border-sky-500/50 group-hover:scale-110 transition-all";
            } 
            else if (state === 'listening') {
                statusText.innerText = "CAPTURANDO ÁUDIO";
                statusDot.className = "w-2 h-2 rounded-full bg-orange-500 animate-ping";
                micLabel.innerText = "ESCUTANDO...";
                micIconBox.className = "w-16 h-16 rounded-full bg-orange-500/20 flex items-center justify-center border border-orange-500/50 scale-110 shadow-[0_0_20px_rgba(249,115,22,0.3)] transition-all";
            }
            else if (state === 'speaking') {
                statusText.innerText = "SINTETIZANDO";
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                micLabel.innerText = "PROCESSANDO";
                micIconBox.className = "w-16 h-16 rounded-full bg-emerald-500/20 flex items-center justify-center border border-emerald-500/50 transition-all";
            }
        }

        /* ==========================================
           2. SISTEMA DE VOZ (TTS e STT)
           ========================================== */
        let speechSynth = window.speechSynthesis;
        let speechRecognition = null;
        let selectedVoice = null;
        let isListening = false;

        // Desbloqueia o áudio com interação do usuário
        initOverlay.addEventListener('click', () => {
            // Um truque para desbloquear a API de Voz no Chrome/Safari
            const unlockUtterance = new SpeechSynthesisUtterance("");
            speechSynth.speak(unlockUtterance);
            
            initOverlay.style.opacity = '0';
            setTimeout(() => {
                initOverlay.style.display = 'none';
                appendLog('SYSTEM', 'Módulos de voz destravados.');
                setCoreState('idle', "Sistemas operacionais. Pronto para receber comandos.");
            }, 500);
        });

        // Carrega as Vozes disponíveis no SO
        function loadVoices() {
            const voices = speechSynth.getVoices();
            if (voices.length > 0) {
                // Tenta encontrar uma voz PT masculina padrão ou Google
                selectedVoice = voices.find(v => v.lang.includes('pt') && (v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('male'))) 
                             || voices.find(v => v.lang.includes('pt-BR'))
                             || voices[0];
            }
        }
        if (speechSynth.onvoiceschanged !== undefined) {
            speechSynth.onvoiceschanged = loadVoices;
        }

        // Função de Falar do Jarvis (Baseada em Promises para controle perfeito)
        function speakJarvis(text) {
            return new Promise((resolve) => {
                if (!speechSynth) {
                    appendLog('ERROR', 'Síntese de voz não suportada.', 'error');
                    resolve();
                    return;
                }

                speechSynth.cancel(); // Para fala anterior
                stopMic(); // Desliga mic para ele não se escutar
                
                setCoreState('speaking', text);
                appendLog('JARVIS', text);

                const utter = new SpeechSynthesisUtterance(text);
                if (selectedVoice) utter.voice = selectedVoice;
                utter.lang = 'pt-BR';
                utter.rate = 1.05; // Levemente mais rápido
                utter.pitch = 0.9; // Levemente mais grave

                utter.onend = () => {
                    setCoreState('idle', "Aguardando próximos comandos.");
                    resolve();
                };
                utter.onerror = (e) => {
                    console.error(e);
                    setCoreState('idle');
                    resolve();
                };

                speechSynth.speak(utter);
            });
        }

        // Inicializa o STT (Reconhecimento de Voz)
        function initSTT() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                appendLog('ERROR', 'Reconhecimento não suportado neste navegador.', 'error');
                return;
            }

            speechRecognition = new SR();
            speechRecognition.lang = 'pt-BR';
            speechRecognition.continuous = false;
            speechRecognition.interimResults = false;

            speechRecognition.onstart = () => {
                isListening = true;
                setCoreState('listening', "Escutando diretivas...");
            };

            speechRecognition.onresult = async (e) => {
                const query = e.results[0][0].transcript.trim();
                stopMic();
                if (query) {
                    appendLog('USER', query);
                    await processIntent(query);
                }
            };

            speechRecognition.onerror = (e) => {
                stopMic();
                if (e.error !== 'aborted' && e.error !== 'no-speech') {
                    appendLog('ERROR', `Erro no microfone: ${e.error}`, 'error');
                }
            };

            speechRecognition.onend = () => {
                if (isListening) stopMic();
            };
        }

        function toggleMic() {
            if (isListening) {
                stopMic();
            } else {
                startMic();
            }
        }

        function startMic() {
            if (!speechRecognition) initSTT();
            if (speechRecognition && !isListening) {
                try { speechRecognition.start(); } catch(e){}
            }
        }

        function stopMic() {
            isListening = false;
            if (speechRecognition) {
                try { speechRecognition.stop(); } catch(e){}
            }
            if (aiCore.classList.contains('state-listening')) {
                setCoreState('idle', "Aguardando comandos.");
            }
        }

        micBtn.addEventListener('click', toggleMic);

        /* ==========================================
           3. PROCESSAMENTO LÓGICO DE INTENÇÕES (NLP Básico)
           ========================================== */
        async function processIntent(transcript) {
            const text = transcript.toLowerCase().trim();
            let response = "";
            let action = null; // Função a executar após a fala

            // 1. Apresentação e Status
            if (text.includes('quem é você') || text.includes('quem é voce') || text.includes('seu nome')) {
                response = "Eu sou Jarvis. Uma interface de núcleo avançado, projetada para otimizar suas tarefas digitais.";
            }
            else if (text.includes('olá') || text.includes('tudo bem') || text === 'jarvis') {
                response = "Olá. Os sistemas centrais estão online e operando em capacidade máxima.";
            }
            // 2. Horário
            else if (text.includes('horas') || text.includes('que horas são')) {
                const now = new Date();
                response = `Neste momento são exatamente ${now.getHours()} horas e ${now.getMinutes()} minutos.`;
            }
            // 3. Abertura de Aplicativos/Sites
            else if (text.startsWith('abrir') || text.startsWith('abre') || text.includes('iniciar') || text.includes('tocar')) {
                let target = text.replace(/abrir|abre|iniciar|tocar|o|a|os|as/gi, '').trim();
                let url = "";

                if (target.includes('youtube')) { url = "https://youtube.com"; target = "YouTube"; }
                else if (target.includes('spotify') || target.includes('música')) { url = "https://open.spotify.com"; target = "Spotify"; }
                else if (target.includes('whatsapp')) { url = "https://web.whatsapp.com"; target = "WhatsApp"; }
                else if (target.includes('gmail') || target.includes('e-mail')) { url = "https://mail.google.com"; target = "Gmail"; }
                else if (target.includes('calculadora')) { url = "https://www.google.com/search?q=calculadora"; target = "Calculadora"; }
                else if (target.includes('mapas') || target.includes('gps')) { url = "https://maps.google.com"; target = "Google Maps"; }
                else {
                    url = `https://www.google.com/search?q=${encodeURIComponent(target)}`;
                }

                response = `Entendido. Estabelecendo conexão com ${target}.`;
                action = () => window.open(url, "_blank");
            }
            // 4. Pesquisas Web / Dúvidas Gerais
            else if (text.includes('pesquisar por') || text.includes('buscar por') || text.includes('quem foi') || text.includes('o que é')) {
                let query = text.replace(/pesquisar por|buscar por|sobre|quem foi|o que é/gi, '').trim();
                response = `Realizando varredura no banco de dados global sobre: ${query}.`;
                action = () => window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, "_blank");
            }
            // 5. Limpar Tela/Logs
            else if (text.includes('limpar') || text.includes('apagar registros')) {
                response = "Limpando os registros do terminal visual.";
                action = () => { logContainer.innerHTML = ''; appendLog('SYSTEM', 'Terminal limpo.'); };
            }
            // 6. Fallback Dinâmico (Quando ele não entende um comando exato)
            else {
                response = `Processando diretiva desconhecida. Buscando referências para: ${transcript}.`;
                action = () => window.open(`https://www.google.com/search?q=${encodeURIComponent(transcript)}`, "_blank");
            }

            // Fluxo de Execução
            await speakJarvis(response);
            if (action) {
                setTimeout(action, 500); // Executa a ação (ex: abrir aba) após falar
            }
        }
    </script>
</body>
</html>
