<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE // Minimalist Neural Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        clean: {
                            900: '#000205',
                            800: '#060913',
                            700: '#111726',
                            cyan: '#00f0ff',
                            fire: '#ff4500'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.6s ease; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    </style>
</head>
<body id="appBody" class="bg-clean-900 text-gray-100 h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <!-- Minimal Header -->
    <header class="w-full px-8 py-6 flex items-center justify-between z-30 pointer-events-auto">
        <div class="flex items-center gap-3">
            <div id="headerDot" class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_12px_#00f0ff] animate-pulse"></div>
            <span class="font-mono text-xs tracking-widest uppercase text-gray-400 font-medium">SYNAPSE // CORE</span>
        </div>
        <div class="flex items-center gap-4 text-xs font-mono">
            <button id="btnThemeToggle" class="text-gray-400 hover:text-white transition px-3 py-1 rounded-full border border-white/10 hover:border-white/30 bg-white/5">
                Mudar Tema
            </button>
            <button id="btnLogsToggle" class="text-gray-400 hover:text-white transition px-3 py-1 rounded-full border border-white/10 hover:border-white/30 bg-white/5">
                Logs Multi-Agente
            </button>
        </div>
    </header>

    <!-- Center Immersive Workspace (Canvas + Floating Modules) -->
    <main class="absolute inset-0 z-0 flex flex-col items-center justify-center pointer-events-none px-6">
        
        <!-- Canvas 3D Biomechanical Brain -->
        <canvas id="neuralCanvas" class="absolute inset-0 z-0 w-full h-full cursor-grab active:cursor-grabbing pointer-events-auto"></canvas>

        <!-- Clean Vignette Mask -->
        <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_30%,#000205_85%)] z-10"></div>

        <!-- Floating Agent HUD (Clean Minimalist) -->
        <div class="relative z-20 text-center pointer-events-auto mb-6 transition-all duration-300">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 backdrop-blur-md mb-3">
                <span id="activeAgentBadge" class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
                <span id="activeAgentName" class="text-[10px] font-mono tracking-wider uppercase text-cyan-400 font-bold">SUPERVISOR (PRIME)</span>
            </div>
            <h1 id="hudMainText" class="text-sm md:text-base font-light text-gray-300 max-w-md mx-auto tracking-wide">
                Aguardando diretiva do arquiteto...
            </h1>
        </div>

        <!-- Dynamic Autopoietic Grid (Constructed by Agents) -->
        <div id="cleanGrid" class="relative z-25 w-full max-w-3xl grid grid-cols-1 sm:grid-cols-2 gap-3 pointer-events-auto max-h-[28vh] overflow-y-auto pr-1">
            <!-- Initial clean state node -->
            <div class="bg-clean-800/60 border border-white/10 rounded-2xl p-4 backdrop-blur-xl shadow-2xl flex flex-col justify-between group hover:border-cyan-500/40 transition">
                <div class="flex justify-between items-start mb-1">
                    <span class="text-[11px] font-mono font-bold text-gray-300 tracking-wider">NÚCLEO BASE</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                </div>
                <p class="text-xs text-gray-400 font-light">Matriz pronta para construir módulos via comandos.</p>
            </div>
        </div>

    </main>

    <!-- Bottom Clean Input Dock -->
    <footer class="w-full px-8 pb-8 flex justify-center z-30 pointer-events-auto">
        <div class="w-full max-w-xl bg-clean-800/80 border border-white/10 rounded-2xl p-2 flex items-center gap-3 backdrop-blur-2xl shadow-2xl">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Comande os agentes (ex: 'Crie um painel de métricas', 'Mude para fogo')..." 
                class="bg-transparent text-gray-100 placeholder-gray-500 text-xs font-mono outline-none flex-grow px-3"
            />
            <button id="micBtn" class="p-2.5 bg-white/5 border border-white/10 hover:border-white/30 text-cyan-400 rounded-xl transition flex items-center justify-center group" title="Ativar Voz">
                <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Minimal Logs Modal -->
    <div id="logsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-clean-800 border border-white/10 rounded-3xl p-6 max-w-lg w-full shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/10">
                <span class="text-xs font-mono font-bold text-gray-300 uppercase tracking-widest">Logs de Sincronização Multi-Agente</span>
                <button id="closeLogs" class="text-gray-400 hover:text-white text-xs font-bold px-2 py-1">✕</button>
            </div>
            <div id="logsList" class="flex-grow overflow-y-auto space-y-2 pr-1 font-mono text-[11px] text-gray-300">
                <!-- Logs dinâmicos -->
            </div>
        </div>
    </div>

    <!-- Script Clean & Professional Minimalist Engine -->
    <script>
        const canvas = document.getElementById('neuralCanvas');
        const container = canvas.parentElement;
        const ctx = canvas.getContext('2d', { alpha: false });

        const userInput = document.getElementById('userInput');
        const micBtn = document.getElementById('micBtn');
        const hudMainText = document.getElementById('hudMainText');
        const activeAgentName = document.getElementById('activeAgentName');
        const activeAgentBadge = document.getElementById('activeAgentBadge');
        const cleanGrid = document.getElementById('cleanGrid');
        
        const btnLogsToggle = document.getElementById('btnLogsToggle');
        const logsModal = document.getElementById('logsModal');
        const closeLogs = document.getElementById('closeLogs');
        const logsList = document.getElementById('logsList');
        const btnThemeToggle = document.getElementById('btnThemeToggle');
        const appBody = document.getElementById('appBody');
        const headerDot = document.getElementById('headerDot');

        let isListening = false;
        let speechRecognition = null;
        let speechSynth = window.speechSynthesis;
        let audioCtx = null, analyser = null, dataArray = null, micStream = null;

        let themeMode = 0; // 0 = Clean Cyan, 1 = Quantum Fire, 2 = Deep Purple
        let intensityVol = 0;
        let animTime = 0;

        let syncLogs = [
            { time: new Date().toLocaleTimeString(), agent: "SUPERVISOR", text: "SYNAPSE Clean Matrix online. Agentes operacionais." }
        ];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- CÉREBRO 3D BIOMECÂNICO ---
        const brainNodes = [];
        const nodeCount = 380;

        for (let i = 0; i < nodeCount; i++) {
            let x, y, z, valid = false;
            while (!valid) {
                x = (Math.random() - 0.5) * 2.4;
                y = (Math.random() - 0.5) * 1.5;
                z = (Math.random() - 0.5) * 2.5;
                const eq = (x * x) / 1.1 + (y * y) / 0.58 + (z * z) / 1.4;
                if (eq <= 1.0) {
                    if (Math.abs(x) < 0.1) continue;
                    valid = true;
                }
            }
            const depth = 0.6 + Math.random() * 0.4;
            brainNodes.push({ baseX: x * depth, baseY: y * depth, baseZ: z * depth, radius: Math.random() * 1.4 + 0.4 });
        }

        const brainEdges = [];
        for (let i = 0; i < brainNodes.length; i++) {
            let links = 0;
            for (let j = i + 1; j < brainNodes.length; j++) {
                if (links > 2) break;
                const dx = brainNodes[i].baseX - brainNodes[j].baseX;
                const dy = brainNodes[i].baseY - brainNodes[j].baseY;
                const dz = brainNodes[i].baseZ - brainNodes[j].baseZ;
                const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                if (dist < 0.28) {
                    brainEdges.push({ a: i, b: j });
                    links++;
                }
            }
        }

        // --- SISTEMA DE VOZ DO JARVIS ---
        function speakClean(text, agent = "SUPERVISOR") {
            hudMainText.innerText = text;
            activeAgentName.innerText = `${agent} (PRIME)`;
            if (speechSynth) {
                speechSynth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'pt-BR';
                utter.rate = 1.05;
                utter.pitch = agent === "ANALISTA" ? 0.9 : (agent === "AUDITOR" ? 0.8 : 0.75);
                speechSynth.speak(utter);
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SR();
            speechRecognition.lang = 'pt-BR';
            speechRecognition.onresult = (e) => {
                const query = e.results[0][0].transcript;
                userInput.value = query;
                executePipeline(query);
            };
            speechRecognition.onend = () => stopMic();
        }

        micBtn.addEventListener('click', async () => {
            if (isListening) {
                stopMic();
                return;
            }
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                const source = audioCtx.createMediaStreamSource(micStream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                isListening = true;
                micBtn.classList.add('bg-clean-fire/20', 'border-clean-fire/40', 'text-clean-fire');
                speak("Escutando comandos de voz...", "SUPERVISOR");
                if (speechRecognition) speechRecognition.start();
            } catch (err) {
                speak("Erro ao aceder ao microfone.", "SUPERVISOR");
            }
        });

        function stopMic() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            if (speechRecognition) { try { speechRecognition.stop(); } catch(e){} }
            isListening = false;
            intensityVol = 0;
            micBtn.classList.remove('bg-clean-fire/20', 'border-clean-fire/40', 'text-clean-fire');
        }

        // --- PIPELINE MULTI-AGENTE & MUTAÇÕES ---
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && userInput.value.trim() !== '') {
                const text = userInput.value;
                userInput.value = '';
                executePipeline(text);
            }
        });

        btnThemeToggle.addEventListener('click', () => {
            themeMode = (themeMode + 1) % 3;
            applyTheme(themeMode);
        });

        function applyTheme(mode) {
            if (mode === 0) {
                appBody.className = "bg-clean-900 text-gray-100 h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-cyan-500 selection:text-black";
                headerDot.className = "w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_12px_#00f0ff] animate-pulse";
                activeAgentBadge.className = "w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping";
                speak("Tema Ciano Minimalista ativado.", "SUPERVISOR");
                recordLog("ANALISTA", "Tema alterado para Clean Cyan.");
            } else if (mode === 1) {
                appBody.className = "bg-[#0a0301] text-gray-100 h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-orange-500 selection:text-black";
                headerDot.className = "w-2 h-2 rounded-full bg-orange-500 shadow-[0_0_15px_#ff4500] animate-pulse";
                activeAgentBadge.className = "w-1.5 h-1.5 rounded-full bg-orange-500 animate-ping";
                speak("Tema Fogo Quântico ativado.", "ANALISTA");
                recordLog("ANALISTA", "Tema alterado para Quantum Fire.");
            } else {
                appBody.className = "bg-[#04010a] text-gray-100 h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-purple-500 selection:text-black";
                headerDot.className = "w-2 h-2 rounded-full bg-purple-500 shadow-[0_0_15px_#b000ff] animate-pulse";
                activeAgentBadge.className = "w-1.5 h-1.5 rounded-full bg-purple-500 animate-ping";
                speak("Tema Roxo Místico ativado.", "AUDITOR");
                recordLog("AUDITOR", "Tema alterado para Mystic Purple.");
            }
        }

        function recordLog(agent, text) {
            syncLogs.push({ time: new Date().toLocaleTimeString(), agent, text });
            renderLogs();
        }

        function executePipeline(cmd) {
            intensityVol = 100; // Burst visual
            const lower = cmd.toLowerCase();

            recordLog("SUPERVISOR", `Input recebido: "${cmd}". A delegar subtarefas.`);
            speak("Processando diretiva...", "SUPERVISOR");

            setTimeout(() => {
                recordLog("ANALISTA", `[SUPERVISOR -> ANALISTA]: Construção de componente em curso para: ${cmd}`);
                activeAgentName.innerText = "ANALISTA (DAEDALUS)";
                
                if (lower.includes('fogo') || lower.includes('quente')) applyTheme(1);
                else if (lower.includes('roxo') || lower.includes('místico')) applyTheme(2);
                else if (lower.includes('ciano') || lower.includes('azul')) applyTheme(0);
            }, 600);

            setTimeout(() => {
                recordLog("AUDITOR", `[ANALISTA -> AUDITOR]: Validação de integridade e segurança estrutural.`);
                activeAgentName.innerText = "AUDITOR (SENTINEL)";
            }, 1200);

            setTimeout(() => {
                recordLog("SUPERVISOR", `[AUDITOR -> SUPERVISOR]: Sincronização concluída. Módulo injetado.`);
                activeAgentName.innerText = "SUPERVISOR (PRIME)";
                
                spawnCleanCard(cmd);
                speak("Módulo construído e integrado com sucesso.", "SUPERVISOR");
            }, 1800);
        }

        function spawnCleanCard(directive) {
            const card = document.createElement('div');
            card.className = "bg-clean-800/80 border border-white/10 rounded-2xl p-4 backdrop-blur-xl shadow-2xl flex flex-col justify-between group hover:border-cyan-500/40 transition animate-[fadeIn_0.4s_ease-out]";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <span class="text-[11px] font-mono font-bold text-gray-200 tracking-wider">MÓDULO: ${directive.substring(0, 16)}</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-ping"></span>
                </div>
                <p class="text-xs text-gray-400 font-light">Gerado autonomamente pelos agentes: "${directive}"</p>
            `;
            cleanGrid.prepend(card);
        }

        btnLogsToggle.addEventListener('click', () => { logsModal.classList.remove('hidden'); renderLogs(); });
        closeLogs.addEventListener('click', () => logsModal.classList.add('hidden'));

        function renderLogs() {
            logsList.innerHTML = syncLogs.slice().reverse().map(l => `
                <div class="bg-black/40 p-2.5 rounded-xl border border-white/5 flex flex-col gap-1">
                    <div class="flex justify-between text-[10px] font-mono font-bold text-cyan-400">
                        <span>[${l.agent}]</span>
                        <span class="text-gray-500">${l.time}</span>
                    </div>
                    <div class="text-gray-300">${l.text}</div>
                </div>
            `).join('');
        }

        // --- RENDERIZAÇÃO 3D LIMPA (60 FPS) ---
        function renderLoop() {
            animTime += 0.02;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = themeMode === 1 ? '#0a0301' : (themeMode === 2 ? '#04010a' : '#000205');
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            const scale = Math.min(canvas.width, canvas.height) * 0.42;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            let curVol = 0;
            if (isListening && analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                curVol = sum / dataArray.length;
            }

            intensityVol += (curVol - intensityVol) * 0.2;
            const volScale = intensityVol / 40;

            const rotY = animTime * 0.22;
            const rotX = Math.sin(animTime * 0.3) * 0.08;
            const sY = Math.sin(rotY), cY = Math.cos(rotY);
            const sX = Math.sin(rotX), cX = Math.cos(rotX);

            const proj = brainNodes.map(p => {
                const pulse = 1 + (Math.sin(animTime * 4 + p.baseX) * 0.02) + (volScale * 0.25);
                const px = p.baseX * scale * pulse;
                const py = p.baseY * scale * pulse;
                const pz = p.baseZ * scale * pulse;

                const x1 = px * cY + pz * sY;
                const z1 = pz * cY - px * sY;
                const y2 = py * cX - z1 * sX;
                const z2 = z1 * cX + py * sX;

                const persp = 1000 / (1000 - z2);
                return {
                    projX: centerX + x1 * persp,
                    projY: centerY + y2 * persp,
                    z2, persp, ...p
                };
            });

            let edgeCol = themeMode === 1 ? 'rgba(255, 69, 0, ' : (themeMode === 2 ? 'rgba(176, 0, 255, ' : 'rgba(0, 240, 255, ');
            let nodeCol = themeMode === 1 ? 'rgba(255, 100, 0, ' : (themeMode === 2 ? 'rgba(200, 50, 255, ' : 'rgba(0, 240, 255, ');
            let glowCol = themeMode === 1 ? '#ff4500' : (themeMode === 2 ? '#b000ff' : '#00f0ff');

            ctx.lineWidth = volScale > 0.3 ? 1.4 : 0.5;
            for (let i = 0; i < brainEdges.length; i++) {
                const p1 = proj[brainEdges[i].a];
                const p2 = proj[brainEdges[i].b];
                const avgP = (p1.persp + p2.persp) / 2;
                if (avgP < 0.6) continue;

                const alpha = Math.max(0.03, Math.min(0.4, (avgP - 0.6) * 0.8 + (volScale * 0.3)));
                
                ctx.beginPath();
                ctx.moveTo(p1.projX, p1.projY);
                ctx.lineTo(p2.projX, p2.projY);
                ctx.strokeStyle = edgeCol + `${alpha * (volScale > 0.3 ? 1.5 : 1)})`;
                ctx.stroke();
            }

            proj.sort((a, b) => a.z2 - b.z2);
            proj.forEach(p => {
                if (p.persp < 0.4) return;
                const size = Math.max(0.3, p.radius * p.persp * (1 + volScale * 0.7));
                
                ctx.beginPath();
                ctx.arc(p.projX, p.projY, size, 0, Math.PI * 2);
                ctx.shadowBlur = volScale > 0.3 ? 18 : 5;
                ctx.shadowColor = glowCol;
                ctx.fillStyle = nodeCol + `${Math.min(1, p.persp)})`;
                ctx.fill();
            });

            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>
</body>
</html>
