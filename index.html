<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL IA // Siri Neural Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;500;700&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background: #000406; overflow-x: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(1, 4, 9, 0.9); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.4); border-radius: 2px; }
        .stark-panel {
            background: rgba(0, 242, 254, 0.04);
            border: 1px solid rgba(0, 242, 254, 0.6);
            box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.15), 0 0 30px rgba(0, 242, 254, 0.25);
            backdrop-filter: blur(12px);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }
        .stark-input-panel {
            background: rgba(1, 12, 24, 0.95);
            border: 1px solid rgba(0, 242, 254, 0.8);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
        }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
    </style>
</head>
<body class="min-h-screen w-screen overflow-x-hidden flex flex-col justify-between select-none text-[#00f2fe] m-0 p-0">
    
    <div id="keyModal" class="modal-backdrop">
        <div class="stark-panel p-8 w-96 flex flex-col gap-4">
            <div class="text-[#00f2fe] text-xl font-bold font-orbitron mb-2">CONFIGURAR API GEMINI</div>
            <p class="text-sm text-gray-300 mb-4">Insira sua API Key (salva localmente, nunca é enviada para servidor)</p>
            <input type="password" id="apiKeyInput" placeholder="AQ.Ab8RN6K8lJcMye0BvB_5ckuP4D..." class="w-full bg-black/80 text-[#00f2fe] border border-[#00f2fe] p-3 rounded outline-none text-sm" />
            <button id="saveKeyBtn" class="w-full bg-[#00f2fe] text-black font-bold p-3 rounded hover:bg-cyan-400 transition cursor-pointer">✓ CONFIRMAR E INICIAR</button>
        </div>
    </div>

    <canvas id="hudCanvas" class="fixed inset-0 z-0 w-full h-full pointer-events-none"></canvas>
    <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_10%,#000406_94%)] z-10"></div>
    
    <header class="relative z-20 p-4 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-none w-full max-w-7xl mx-auto">
        <div class="stark-panel p-3.5 flex flex-col gap-2 pointer-events-auto w-full sm:w-64">
            <div class="flex items-center justify-between">
                <span class="text-[10px] tracking-widest uppercase text-[#00f2fe] font-bold">NEURAL AI // SIRI CORE</span>
                <span id="systemPulseDot" class="w-2 h-2 rounded-full bg-[#00f2fe] animate-ping shadow-[0_0_12px_#00f2fe]"></span>
            </div>
            <div id="clockDisplay" class="text-lg font-orbitron font-bold text-white tracking-widest">00:00:00</div>
            <div class="text-[9px] text-cyan-400/90 tracking-wider">CHEFIA: <strong id="adminUserLabel" class="text-white">Fagundes</strong></div>
        </div>
        <div class="stark-panel p-3.5 flex flex-col gap-2 pointer-events-auto w-full sm:w-80">
            <div class="flex items-center justify-between text-[10px] uppercase font-bold tracking-wider">
                <span class="text-[#00f2fe]">SUB-AGENTES</span>
                <span id="agentCountBadge" class="text-emerald-400">4 ATIVOS</span>
            </div>
            <div id="agentsListContainer" class="max-h-20 overflow-y-auto space-y-1 text-[10px] text-gray-300 font-mono pr-1"></div>
        </div>
    </header>
    
    <main class="relative z-20 flex-grow flex flex-col items-center justify-center pointer-events-none px-4 sm:px-6 py-4 my-auto gap-4 w-full max-w-4xl mx-auto">
        <div class="stark-panel px-6 py-5 text-center pointer-events-auto w-full shadow-[0_0_50px_rgba(0,242,254,0.3)]">
            <div id="protocolLabel" class="text-[10px] tracking-widest text-[#00f2fe] font-bold uppercase mb-1">NEURAL IA PROTOCOL</div>
            <p id="voiceFeedback" class="text-xs sm:text-sm font-light text-gray-200 tracking-wider leading-relaxed font-mono">"Motor ativo. Fale comigo, Fagundes."</p>
        </div>
        <div id="dynamicPlatform" class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3 pointer-events-auto max-h-[35vh] overflow-y-auto pr-1">
            <div class="stark-panel p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[11px] font-bold text-[#00f2fe] uppercase tracking-wider">Siri AI Bridge</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                </div>
                <p class="text-[11px] text-gray-300 font-light">Respostas com IA real.</p>
            </div>
        </div>
    </main>
    
    <footer class="relative z-30 p-4 sm:p-8 flex justify-center pointer-events-auto w-full max-w-3xl mx-auto">
        <div class="stark-input-panel w-full p-2.5 sm:p-3 flex items-center gap-3">
            <input type="text" id="textInput" placeholder="Insira diretiva ou faça uma pergunta..." class="bg-transparent text-[#00f2fe] placeholder-cyan-900/60 text-xs sm:text-sm outline-none flex-grow px-3" />
            <button id="micBtn" class="p-2.5 sm:p-3 bg-[#00f2fe]/15 border border-[#00f2fe]/60 hover:bg-[#00f2fe]/30 text-[#00f2fe] rounded-xl transition cursor-pointer shadow-[0_0_25px_rgba(0,242,254,0.5)]">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>
        </div>
    </footer>

    <script>
        let apiKey = localStorage.getItem('neural_ia_api_key') || '';
        const keyModal = document.getElementById('keyModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');

        if (!apiKey) {
            keyModal.style.display = 'flex';
        } else {
            keyModal.style.display = 'none';
        }

        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key.length > 10) {
                localStorage.setItem('neural_ia_api_key', key);
                apiKey = key;
                keyModal.style.display = 'none';
            } else {
                alert('Chave inválida!');
            }
        });

        apiKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveKeyBtn.click();
        });

        const codeChars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
        const codeLines = [];
        for (let i = 0; i < 15; i++) {
            codeLines.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                speed: Math.random() * 2 + 0.5,
                opacity: Math.random() * 0.5 + 0.3
            });
        }

        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');
        const clockDisplay = document.getElementById('clockDisplay');
        const agentsListContainer = document.getElementById('agentsListContainer');
        const agentCountBadge = document.getElementById('agentCountBadge');
        const dynamicPlatform = document.getElementById('dynamicPlatform');
        const adminUserLabel = document.getElementById('adminUserLabel');
        const systemPulseDot = document.getElementById('systemPulseDot');

        let isListening = false, speechRecognition = null, speechSynth = window.speechSynthesis;
        let angleTicker = 0;
        let currentAdminName = localStorage.getItem('neural_admin_name') || "Fagundes";
        adminUserLabel.innerText = currentAdminName;

        let internalAgents = [
            { id: 1, name: "Orquestrador", status: "Ativo" },
            { id: 2, name: "Executor DOM", status: "Ativo" },
            { id: 3, name: "Siri Bridge", status: "Ativo" },
            { id: 4, name: "Gemini Core", status: "Ativo" }
        ];

        const neuralNodes = [];
        for (let i = 0; i < 45; i++) {
            neuralNodes.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                radius: Math.random() * 2 + 1.2
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        setInterval(() => {
            const now = new Date();
            clockDisplay.innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        function renderAgentsUI() {
            agentCountBadge.innerText = `${internalAgents.length} ATIVOS`;
            agentsListContainer.innerHTML = internalAgents.map(a => `
                <div class="flex justify-between items-center bg-black/60 p-1.5 rounded border border-cyan-500/20">
                    <span class="text-cyan-300 font-bold">${a.name}</span>
                    <span class="text-emerald-400 text-[9px]">${a.status}</span>
                </div>
            `).join('');
        }
        renderAgentsUI();

        let selectedVoice = null;
        function loadVoices() {
            const voices = speechSynth.getVoices();
            selectedVoice = voices.find(v => v.lang.includes('pt')) || voices[0];
        }
        speechSynth.onvoiceschanged = loadVoices;
        loadVoices();

        function speakJarvis(text) {
            voiceFeedback.innerText = `"${text}"`;
            if (speechSynth) {
                speechSynth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                if (selectedVoice) utter.voice = selectedVoice;
                utter.lang = 'pt-BR';
                utter.rate = 0.98;
                utter.pitch = 0.45;
                speechSynth.speak(utter);
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SR();
            speechRecognition.lang = 'pt-BR';
            speechRecognition.continuous = false;
            speechRecognition.interimResults = false;

            speechRecognition.onresult = (e) => {
                let finalTranscript = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        finalTranscript += e.results[i][0].transcript;
                    }
                }
                
                const spokenQuery = finalTranscript.trim();
                if (spokenQuery && e.results[e.results.length - 1].isFinal) {
                    textInput.value = spokenQuery;
                    stopMic();
                    setTimeout(() => executeAutonomousCommand(spokenQuery), 100);
                }
            };

            speechRecognition.onerror = () => stopMic();
            speechRecognition.onend = () => stopMic();
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                stopMic();
            } else if (speechRecognition) {
                speechRecognition.start();
                isListening = true;
                micBtn.classList.add('bg-red-500/40', 'border-red-400', 'text-white');
                systemPulseDot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping";
                speakJarvis(`Escutando, ${currentAdminName}.`);
            }
        });

        function stopMic() {
            if (speechRecognition) speechRecognition.stop();
            isListening = false;
            micBtn.classList.remove('bg-red-500/40', 'border-red-400', 'text-white');
            systemPulseDot.className = "w-2 h-2 rounded-full bg-[#00f2fe] animate-ping";
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && textInput.value.trim()) {
                const val = textInput.value.trim();
                textInput.value = '';
                executeAutonomousCommand(val);
            }
        });

        const appDatabase = {
            'spotify': 'https://open.spotify.com',
            'gmail': 'https://mail.google.com',
            'youtube': 'https://youtube.com',
            'maps': 'https://maps.google.com',
            'whatsapp': 'https://web.whatsapp.com',
            'instagram': 'https://instagram.com',
            'facebook': 'https://facebook.com'
        };

        async function executeAutonomousCommand(directive) {
            const lower = directive.toLowerCase().trim();

            if (lower.startsWith('abrir ') || lower.startsWith('tocar ')) {
                let target = directive.replace(/^(abrir|tocar)\s+(o|a|os|as)?\s*/i, '').toLowerCase();
                for (const [key, url] of Object.entries(appDatabase)) {
                    if (target.includes(key)) {
                        speakJarvis(`Abrindo ${key}.`);
                        setTimeout(() => window.open(url, "_blank"), 500);
                        return;
                    }
                }
            }

            if (!apiKey) {
                speakJarvis("Erro: API key não configurada.");
                return;
            }

            speakJarvis(`Processando...`);
            try {
                const response = await callGeminiAPI(directive);
                speakJarvis(response);
                spawnPlatformWidget(`NEURAL IA`, response);
            } catch (err) {
                speakJarvis("Erro ao processar.");
            }
        }

        async function callGeminiAPI(promptText) {
            const payload = {
                contents: [{role: "user", parts: [{text: promptText}]}],
                generationConfig: {temperature: 0.7, maxOutputTokens: 300}
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('API Error');
            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error('Resposta vazia');
            return text.substring(0, 500);
        }

        function spawnPlatformWidget(title, content) {
            const card = document.createElement('div');
            card.className = "stark-panel p-4";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[11px] font-bold text-[#00f2fe] uppercase">${title}</span>
                </div>
                <p class="text-[11px] text-gray-300 font-light">${content}</p>
            `;
            dynamicPlatform.prepend(card);
        }

        function renderStarkHUD() {
            angleTicker += 0.015;
            ctx.fillStyle = '#000406';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = isListening ? 'rgba(255, 61, 0, 0.03)' : 'rgba(0, 242, 254, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.height; i += 4) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            const primaryColor = isListening ? '255, 61, 0' : '0, 242, 254';
            const primaryColorHex = isListening ? '#ff3d00' : '#00f2fe';

            ctx.fillStyle = isListening ? 'rgba(255, 61, 0, 0.15)' : 'rgba(0, 242, 254, 0.15)';
            ctx.font = '12px monospace';
            for (let line of codeLines) {
                ctx.globalAlpha = line.opacity;
                ctx.fillText(codeChars[Math.floor(Math.random() * codeChars.length)], line.x, line.y);
                line.y += line.speed;
                if (line.y > canvas.height) {
                    line.y = -20;
                    line.x = Math.random() * canvas.width;
                }
            }
            ctx.globalAlpha = 1;

            for (let i = 0; i < neuralNodes.length; i++) {
                let n = neuralNodes[i];
                n.x += n.vx;
                n.y += n.vy;
                if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
                if (n.y < 0 || n.y > canvas.height) n.vy *= -1;

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius * 2.5, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${primaryColor}, ${0.3 * (1 + Math.sin(angleTicker * 2))})`;
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${primaryColor}, 0.9)`;
                ctx.fill();
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.52;
            const pulse = 1 + Math.sin(angleTicker * 3) * 0.1;

            ctx.strokeStyle = `rgb(${primaryColor})`;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * pulse * 1.35, 0, Math.PI * 2);
            ctx.setLineDash([15, 20, 8, 20]);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.lineWidth = 2.5;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * pulse * 1.05, 0, Math.PI * 1.6);
            ctx.stroke();

            ctx.globalAlpha
