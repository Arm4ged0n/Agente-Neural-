<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL IA // Siri Neural Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;500;700&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background: #000406; overflow-x: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(1, 4, 9, 0.9); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.4); border-radius: 2px; }
        
        .stark-panel {
            background: rgba(0, 242, 254, 0.04);
            border: 1px solid rgba(0, 242, 254, 0.6);
            box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.15), 0 0 30px rgba(0, 242, 254, 0.25);
            backdrop-filter: blur(12px);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }
        
        .stark-input-panel {
            background: rgba(1, 12, 24, 0.95);
            border: 1px solid rgba(0, 242, 254, 0.8);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
        }
    </style>
</head>
<body class="min-h-screen w-screen overflow-x-hidden flex flex-col justify-between select-none text-[#00f2fe] m-0 p-0">

    <canvas id="hudCanvas" class="fixed inset-0 z-0 w-full h-full pointer-events-none"></canvas>
    <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_10%,#000406_94%)] z-10"></div>

    <header class="relative z-20 p-4 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-none w-full max-w-7xl mx-auto">
        <div class="stark-panel p-3.5 flex flex-col gap-2 pointer-events-auto w-full sm:w-64">
            <div class="flex items-center justify-between">
                <span class="text-[10px] tracking-widest uppercase text-[#00f2fe] font-bold">NEURAL AI // SIRI CORE</span>
                <span id="systemPulseDot" class="w-2 h-2 rounded-full bg-[#00f2fe] animate-ping shadow-[0_0_12px_#00f2fe]"></span>
            </div>
            <div id="clockDisplay" class="text-lg font-orbitron font-bold text-white tracking-widest">00:00:00</div>
            <div class="text-[9px] text-cyan-400/90 tracking-wider">CHEFIA: <strong id="adminUserLabel" class="text-white">Fagundes</strong></div>
        </div>

        <div class="stark-panel p-3.5 flex flex-col gap-2 pointer-events-auto w-full sm:w-80">
            <div class="flex items-center justify-between text-[10px] uppercase font-bold tracking-wider">
                <span class="text-[#00f2fe]">SUB-AGENTES EXECUTORES</span>
                <span id="agentCountBadge" class="text-emerald-400">4 ATIVOS</span>
            </div>
            <div class="flex gap-2">
                <input type="text" id="newAgentName" placeholder="Nome do Agente..." class="bg-black/80 text-[#00f2fe] border border-[#00f2fe]/40 rounded px-2 py-1 text-[11px] outline-none flex-grow font-mono" />
                <button id="createAgentBtn" class="bg-[#00f2fe]/20 hover:bg-[#00f2fe]/40 border border-[#00f2fe] text-white px-2.5 py-1 rounded text-[11px] font-bold transition cursor-pointer">Criar</button>
            </div>
            <div id="agentsListContainer" class="max-h-20 overflow-y-auto space-y-1 text-[10px] text-gray-300 font-mono pr-1">
            </div>
        </div>
    </header>

    <main class="relative z-20 flex-grow flex flex-col items-center justify-center pointer-events-none px-4 sm:px-6 py-4 my-auto gap-4 w-full max-w-4xl mx-auto">
        <div class="stark-panel px-6 py-5 text-center pointer-events-auto w-full shadow-[0_0_50px_rgba(0,242,254,0.3)]">
            <div id="protocolLabel" class="text-[10px] tracking-widest text-[#00f2fe] font-bold uppercase mb-1">NEURAL IA PROTOCOL</div>
            <p id="voiceFeedback" class="text-xs sm:text-sm font-light text-gray-200 tracking-wider leading-relaxed font-mono">
                "Motor inteligente ativo. Converse comigo, faça perguntas ou peça para abrir apps, Fagundes."
            </p>
        </div>

        <div id="dynamicPlatform" class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3 pointer-events-auto max-h-[35vh] overflow-y-auto pr-1">
            <div class="stark-panel p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[11px] font-bold text-[#00f2fe] uppercase tracking-wider">Siri AI Bridge</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                </div>
                <p class="text-[11px] text-gray-300 font-light">Respostas inteligentes com acesso a hora, data, apps e IA avançada.</p>
            </div>
        </div>
    </main>

    <footer class="relative z-30 p-4 sm:p-8 flex justify-center pointer-events-auto w-full max-w-3xl mx-auto">
        <div class="stark-input-panel w-full p-2.5 sm:p-3 flex items-center gap-3">
            <input 
                type="text" 
                id="textInput" 
                placeholder="Insira diretiva ou faça uma pergunta..." 
                class="bg-transparent text-[#00f2fe] placeholder-cyan-900/60 text-xs sm:text-sm outline-none flex-grow px-3 font-tech"
            />
            <button id="micBtn" class="p-2.5 sm:p-3 bg-[#00f2fe]/15 border border-[#00f2fe]/60 hover:bg-[#00f2fe]/30 text-[#00f2fe] rounded-xl transition flex items-center justify-center group cursor-pointer shadow-[0_0_25px_rgba(0,242,254,0.5)] shrink-0" title="Ativar Microfone">
                <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const apiKey = "";
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');
        const clockDisplay = document.getElementById('clockDisplay');
        const newAgentName = document.getElementById('newAgentName');
        const createAgentBtn = document.getElementById('createAgentBtn');
        const agentsListContainer = document.getElementById('agentsListContainer');
        const agentCountBadge = document.getElementById('agentCountBadge');
        const dynamicPlatform = document.getElementById('dynamicPlatform');
        const adminUserLabel = document.getElementById('adminUserLabel');
        const systemPulseDot = document.getElementById('systemPulseDot');

        let isListening = false;
        let speechRecognition = null;
        let speechSynth = window.speechSynthesis;
        let hudEnergy = 0;
        let angleTicker = 0;
        let lastVoiceCommand = ''; // ✅ GUARDAR ÚLTIMO COMANDO DE VOZ

        let currentAdminName = localStorage.getItem('neural_admin_name') || "Fagundes";
        adminUserLabel.innerText = currentAdminName;

        let internalAgents = [
            { id: 1, name: "Orquestrador Kernel", status: "Executando" },
            { id: 2, name: "Executor de DOM", status: "Ativo" },
            { id: 3, name: "Siri AI Bridge", status: "Pronto" },
            { id: 4, name: "Gemini Neural Core", status: "Ativo" }
        ];

        const neuralNodes = [];
        for (let i = 0; i < 45; i++) {
            neuralNodes.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                radius: Math.random() * 2 + 1.2
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        setInterval(() => {
            const now = new Date();
            clockDisplay.innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        function renderAgentsUI() {
            agentCountBadge.innerText = `${internalAgents.length} ATIVOS`;
            agentsListContainer.innerHTML = internalAgents.map(a => `
                <div class="flex justify-between items-center bg-black/60 p-1.5 rounded border border-cyan-500/20">
                    <span class="text-cyan-300 font-bold">${a.name}</span>
                    <span class="text-emerald-400 text-[9px]">${a.status}</span>
                </div>
            `).join('');
        }
        renderAgentsUI();

        let selectedVoice = null;
        function loadVoices() {
            const voices = speechSynth.getVoices();
            selectedVoice = voices.find(v => v.lang.includes('pt') && (v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('antonio') || v.name.toLowerCase().includes('lucas') || v.name.toLowerCase().includes('male'))) || voices.find(v => v.lang.includes('pt')) || voices[0];
        }
        if (speechSynth.onvoiceschanged !== undefined) {
            speechSynth.onvoiceschanged = loadVoices;
        }
        loadVoices();

        function speakJarvis(text) {
            voiceFeedback.innerText = `"${text}"`;
            if (speechSynth) {
                speechSynth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                if (selectedVoice) utter.voice = selectedVoice;
                utter.lang = 'pt-BR';
                utter.rate = 0.98;
                utter.pitch = 0.45;
                speechSynth.speak(utter);
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SR();
            speechRecognition.lang = 'pt-BR';
            speechRecognition.continuous = false;
            speechRecognition.interimResults = false;

            speechRecognition.onresult = (e) => {
                let finalTranscript = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        finalTranscript += e.results[i][0].transcript;
                    }
                }
                
                const spokenQuery = finalTranscript.trim();
                if (spokenQuery) {
                    textInput.value = spokenQuery;
                    lastVoiceCommand = spokenQuery; // ✅ GUARDAR PARA EXECUTAR NO ONEND
                    console.log('[VOICE CAPTURED]', spokenQuery);
                }
            };

            speechRecognition.onerror = (e) => {
                console.error('[SPEECH ERROR]', e.error);
                stopMic();
            };

            // ✅ EXECUTAR AQUI - QUANDO O RECONHECIMENTO TERMINA
            speechRecognition.onend = () => {
                console.log('[SPEECH ENDED]', lastVoiceCommand);
                if (lastVoiceCommand && lastVoiceCommand.length > 0) {
                    console.log('[AUTO EXECUTE NOW]', lastVoiceCommand);
                    executeAutonomousCommand(lastVoiceCommand);
                    lastVoiceCommand = '';
                    textInput.value = '';
                }
                stopMic();
            };
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                stopMic();
                return;
            }
            if (speechRecognition) {
                try {
                    lastVoiceCommand = '';
                    speechRecognition.start();
                    isListening = true;
                    micBtn.classList.add('bg-red-500/40', 'border-red-400', 'text-white', 'shadow-[0_0_35px_#ff3d00]');
                    systemPulseDot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping shadow-[0_0_20px_#ff3d00]";
                    speakJarvis(`A escutar, ${currentAdminName}.`);
                } catch(err) {
                    console.error('[MIC ERROR]', err);
                    stopMic();
                }
            } else {
                speakJarvis("Reconhecimento de voz não suportado neste navegador.");
            }
        });

        function stopMic() {
            if (speechRecognition) {
                try { speechRecognition.stop(); } catch(e){}
            }
            isListening = false;
            hudEnergy = 0;
            micBtn.classList.remove('bg-red-500/40', 'border-red-400', 'text-white', 'shadow-[0_0_35px_#ff3d00]');
            systemPulseDot.className = "w-2 h-2 rounded-full bg-[#00f2fe] animate-ping shadow-[0_0_10px_#00f2fe]";
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && textInput.value.trim() !== '') {
                const val = textInput.value.trim();
                console.log('[TEXT INPUT]', val);
                textInput.value = '';
                executeAutonomousCommand(val);
            }
        });

        createAgentBtn.addEventListener('click', () => {
            const name = newAgentName.value.trim();
            if (name) {
                registerNewAgent(name, "Em Execução");
                newAgentName.value = '';
            }
        });

        function registerNewAgent(agentName, statusDesc) {
            const cleanName = agentName.replace(/["']/g, "").trim();
            if (!cleanName || cleanName.length < 2) return;
            internalAgents.push({ id: internalAgents.length + 1, name: cleanName, status: statusDesc });
            renderAgentsUI();
            spawnPlatformWidget(`Agente ${cleanName}`, `Sub-agente operacional instanciado com sucesso.`);
            speakJarvis(`Sub-agente ${cleanName} criado e ativado com sucesso.`);
        }

        function getSmartResponse(directive) {
            const lower = directive.toLowerCase().trim();

            if (lower.match(/que horas?|qual.*hora|me diz.*hora|me dis.*hora|horário/i)) {
                const now = new Date();
                const hora = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                return `São ${hora}, ${currentAdminName}.`;
            }

            if (lower.match(/qual.*data|que dia|me diz.*data|me dis.*data|hoje/i)) {
                const now = new Date();
                const data = now.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                return `Hoje é ${data}.`;
            }

            if (lower.match(/^(oi|olá|opa|e aí|tudo bem|como vai|bom dia|boa tarde|boa noite)/i)) {
                return `Olá, ${currentAdminName}. Aqui está o NEURAL IA. Como posso ajudar?`;
            }

            if (lower.match(/quem é você|o que você é|qual é seu nome|quem você é/i)) {
                return `Sou NEURAL IA, seu assistente inteligente criado por Sandro Fagundes. Posso abrir apps, responder perguntas e executar suas ordens.`;
            }

            if (lower.match(/obrigado|valeu|thanks|muito bem|legal/i)) {
                return `Ao seu dispor sempre, ${currentAdminName}.`;
            }

            if (lower.match(/^(adeus|tchau|até logo|até mais|falou|bye)/i)) {
                return `Até logo, ${currentAdminName}. Sempre pronto para servir.`;
            }

            const mathMatch = directive.match(/(\d+)\s*([+\-*\/])\s*(\d+)/);
            if (mathMatch && lower.includes('quanto')) {
                const [, n1, op, n2] = mathMatch;
                let result;
                switch(op) {
                    case '+': result = parseInt(n1) + parseInt(n2); break;
                    case '-': result = parseInt(n1) - parseInt(n2); break;
                    case '*': result = parseInt(n1) * parseInt(n2); break;
                    case '/': result = Math.round(parseInt(n1) / parseInt(n2) * 100) / 100; break;
                }
                return `${n1} ${op} ${n2} é igual a ${result}.`;
            }

            if (lower.match(/como está o tempo|qual é o tempo|está chovendo|vai chover|clima|previsão/i)) {
                return `Para informações de clima em tempo real, abra um navegador e procure pelo clima da sua região.`;
            }

            if (lower.match(/quem.*criou|quem.*fez|criador|desenvolvedor|sandro|fagundes/i)) {
                return `Fui criado por Sandro Fagundes, um entrepreneur e desenvolvedor de IA aplicada a negócios.`;
            }

            return null;
        }

        async function executeAutonomousCommand(directive) {
            hudEnergy = 100;
            const lower = directive.toLowerCase().trim();
            
            console.log('[EXECUTING]', { directive, lower });

            if ((lower.includes('mudar nome') || lower.includes('chame') || lower.includes('nome para')) && lower.length < 60) {
                const patterns = [
                    /mudar nome (?:para |de )?(.+)/i,
                    /chame(?:-me)? (?:de )?(.+)/i,
                    /nome (?:para )?(.+)/i
                ];
                
                for (const pattern of patterns) {
                    const match = directive.match(pattern);
                    if (match && match[1]) {
                        currentAdminName = match[1].replace(/[.!?,]/g, '').trim();
                        localStorage.setItem('neural_admin_name', currentAdminName);
                        adminUserLabel.innerText = currentAdminName;
                        spawnPlatformWidget("Perfil Atualizado", `Nome administrativo alterado para ${currentAdminName}`);
                        speakJarvis(`Nome atualizado para ${currentAdminName}. Pronto, chefe.`);
                        return;
                    }
                }
            }

            if (lower.includes('criar agente') || lower.includes('novo agente')) {
                const patterns = [
                    /criar agente (.+)/i,
                    /novo agente (.+)/i,
                    /criar (?:um )?agente/i
                ];
                
                let extractedName = null;
                for (const pattern of patterns) {
                    const match = directive.match(pattern);
                    if (match && match[1]) {
                        extractedName = match[1].replace(/[.!?,]/g, '').trim();
                        break;
                    }
                }
                
                if (!extractedName || extractedName.length < 2) {
                    extractedName = `Executor #${internalAgents.length + 1}`;
                }
                registerNewAgent(extractedName, "Em Operação");
                return;
            }

            if (lower.startsWith('abrir ') || lower.startsWith('tocar ') || lower.includes('abrir ') || lower.includes('tocar ')) {
                let target = directive
                    .replace(/^(abrir|tocar)\s+/i, '')
                    .replace(/^(o|a|os|as)\s+/i, '')
                    .toLowerCase()
                    .trim();

                const appDatabase = {
                    'spotify': { name: 'Spotify', url: 'https://open.spotify.com' },
                    'música': { name: 'Spotify', url: 'https://open.spotify.com' },
                    'musica': { name: 'Spotify', url: 'https://open.spotify.com' },
                    'gmail': { name: 'Gmail', url: 'https://mail.google.com' },
                    'email': { name: 'Gmail', url: 'https://mail.google.com' },
                    'e-mail': { name: 'Gmail', url: 'https://mail.google.com' },
                    'youtube': { name: 'YouTube', url: 'https://youtube.com' },
                    'bloco de notas': { name: 'Bloco de Notas', url: 'https://keep.google.com' },
                    'notas': { name: 'Google Keep', url: 'https://keep.google.com' },
                    'maps': { name: 'Google Maps', url: 'https://maps.google.com' },
                    'gps': { name: 'Google Maps', url: 'https://maps.google.com' },
                    'localização': { name: 'Google Maps', url: 'https://maps.google.com' },
                    'whatsapp': { name: 'WhatsApp', url: 'https://web.whatsapp.com' },
                    'instagram': { name: 'Instagram', url: 'https://instagram.com' },
                    'facebook': { name: 'Facebook', url: 'https://facebook.com' },
                    'twitter': { name: 'Twitter', url: 'https://twitter.com' },
                    'x': { name: 'X', url: 'https://x.com' }
                };

                let app = null;
                for (const [key, appInfo] of Object.entries(appDatabase)) {
                    if (target === key || target.includes(key)) {
                        app = appInfo;
                        break;
                    }
                }

                if (app) {
                    speakJarvis(`A abrir ${app.name}, ${currentAdminName}.`);
                    spawnPlatformWidget(`Ação Automática`, `Abrindo ${app.name} diretamente...`);
                    setTimeout(() => { window.open(app.url, "_blank"); }, 500);
                    return;
                } else {
                    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(target)}`;
                    speakJarvis(`A pesquisar ${target}, ${currentAdminName}.`);
                    spawnPlatformWidget(`Busca Google`, `Pesquisando: "${target}"`);
                    setTimeout(() => { window.open(searchUrl, "_blank"); }, 500);
                    return;
                }
            }

            const localResponse = getSmartResponse(directive);
            if (localResponse) {
                speakJarvis(localResponse);
                spawnPlatformWidget(`NEURAL IA`, localResponse);
                return;
            }

            if (apiKey) {
                speakJarvis(`A processar, ${currentAdminName}...`);
                spawnPlatformWidget(`IA Avançada`, `Consultando rede neural para: "${directive}"`);

                try {
                    let responseText = await callGeminiAPI(directive);
                    speakJarvis(responseText);
                    spawnPlatformWidget(`NEURAL IA Gemini`, responseText);
                } catch (err) {
                    console.error('[API ERROR]', err);
                    let fallbackMsg = "Não consegui processar essa pergunta neste momento.";
                    speakJarvis(fallbackMsg);
                    spawnPlatformWidget("Erro", fallbackMsg);
                }
            } else {
                const suggestions = "Posso responder sobre hora, data, abrir apps e criar agentes. Para perguntas complexas, configure a API do Gemini.";
                speakJarvis(suggestions);
                spawnPlatformWidget("Modo Limitado", suggestions);
            }
        }

        async function callGeminiAPI(promptText) {
            const systemPrompt = `Tu és o NEURAL IA, assistente de elite de Fagundes. Responde em PT-BR natural, de forma direta e concisa (máximo 2-3 frases curtas, ideal para voz).`;
            
            const payload = {
                contents: [{ role: "user", parts: [{ text: promptText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                tools: [{ "google_search": {} }]
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('Falha API');
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) return text;
                    throw new Error('Vazio');
                } catch (e) {
                    if (attempt === 2) throw e;
                    await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
                }
            }
        }

        function spawnPlatformWidget(title, content) {
            const card = document.createElement('div');
            card.className = "stark-panel p-4 flex flex-col justify-between animate-[fadeIn_0.4s_ease-out]";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[11px] font-bold text-[#00f2fe] uppercase tracking-wider">${title}</span>
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                </div>
                <p class="text-[11px] text-gray-300 font-light leading-relaxed">${content}</p>
                <div class="mt-3 flex justify-between items-center text-[9px] font-mono text-cyan-400/70">
                    <span>STATUS: EXECUTADO</span>
                    <span>NEURAL AI</span>
                </div>
            `;
            dynamicPlatform.prepend(card);
        }

        function renderStarkHUD() {
            angleTicker += 0.015;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000406';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            const primaryColor = isListening ? '255, 61, 0' : '0, 242, 254';
            const secondaryGlow = isListening ? '#ff3d00' : '#00f2fe';

            ctx.lineWidth = 0.8;
            for (let i = 0; i < neuralNodes.length; i++) {
                let n = neuralNodes[i];
                n.x += n.vx;
                n.y += n.vy;

                if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
                if (n.y < 0 || n.y > canvas.height) n.vy *= -1;

                for (let j = i + 1; j < neuralNodes.length; j++) {
                    let n2 = neuralNodes[j];
                    let dx = n.x - n2.x;
                    let dy = n.y - n2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(n.x, n.y);
                        ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = `rgba(${primaryColor}, ${1 - dist / 120})`;
                        ctx.stroke();
                    }
                }

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${primaryColor}, 0.7)`;
                ctx.fill();
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.52;

            ctx.strokeStyle = `rgb(${primaryColor})`;
            ctx.lineWidth = 3;
            ctx.shadowBlur = isListening ? 30 : 18;
            ctx.shadowColor = secondaryGlow;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angleTicker * 0.5);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.35, 0, Math.PI * 2);
            ctx.setLineDash([15, 20, 8, 20]);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(-angleTicker * 0.8);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.05, 0, Math.PI * 1.6);
            ctx.setLineDash([6, 12]);
            ctx.lineWidth = 3.5;
            ctx.stroke();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(centerX, centerY, (radius * 0.38) * (1 + (isListening ? Math.sin(angleTicker * 10) * 0.2 : 0)), 0, Math.PI * 2);
            ctx.fillStyle = isListening ? 'rgba(255, 61, 0, 0.4)' : 'rgba(0, 242, 254, 0.3)';
            ctx.fill();
            ctx.strokeStyle = `rgb(${primaryColor})`;
            ctx.lineWidth = 5;
            ctx.stroke();

            requestAnimationFrame(renderStarkHUD);
        }

        renderStarkHUD();
    </script>
</body>
</html>
