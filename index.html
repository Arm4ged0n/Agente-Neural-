<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Neural Interface</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fireGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.6)); }
            50% { filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.9)); }
        }
        .fire-effect {
            animation: fireGlow 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#020617] m-0 p-0 overflow-hidden font-sans select-none text-white">

    <div id="container" class="w-full h-[100dvh] relative flex flex-col justify-between overflow-hidden">
        
        <!-- Canvas para o Cérebro 3D Neural com Raios -->
        <canvas id="neuralCanvas" class="absolute inset-0 block z-0 w-full h-full cursor-pointer"></canvas>

        <!-- Gradientes e Vignette de Fundo -->
        <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_20%,rgba(2,6,23,0.9)_100%)] z-10"></div>

        <!-- Top Header -->
        <div class="relative z-20 flex justify-between items-center px-6 pt-6">
            <div class="flex items-center gap-3">
                <div id="statusDot" class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
                <span class="text-xs tracking-widest uppercase font-semibold text-cyan-400/90">JARVIS v3.0 // Autonomous Agent</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="agentManagerBtn" class="text-xs bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 px-3 py-1.5 rounded-full hover:bg-cyan-500/20 transition backdrop-blur-md">
                    Agentes (1)
                </button>
            </div>
        </div>

        <!-- Estado Central & Resposta Falada do Agente -->
        <div class="relative z-20 text-center pointer-events-none px-4 mt-2">
            <h2 id="agentStatus" class="text-lg md:text-xl font-medium tracking-wide text-cyan-300 drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]">
                Sistemas Neurais Prontos
            </h2>
            <p id="agentResponse" class="text-xs text-gray-300 mt-1 max-w-md mx-auto h-8 overflow-hidden text-ellipsis">
                Diga um comando ou clique no microfone para ativar os impulsos de fogo neuronal.
            </p>
        </div>

        <!-- Painel de Gestão de Agentes Internos -->
        <div id="agentPanel" class="relative z-30 mx-auto max-w-md w-full px-4 hidden transition-all duration-300">
            <div class="bg-slate-900/95 border border-cyan-500/40 rounded-2xl p-4 backdrop-blur-xl shadow-2xl">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Criar Agente Inteligente</span>
                    <button id="closeAgentPanel" class="text-gray-400 hover:text-white text-xs">✕</button>
                </div>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="agentNameInput" placeholder="Nome do Agente (ex: Spotify Bot)" class="bg-black/40 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white flex-grow outline-none focus:border-cyan-400">
                    <button id="createAgentBtn" class="bg-cyan-500 text-black font-semibold px-3 py-1.5 rounded-xl text-xs hover:bg-cyan-400 transition">Criar</button>
                </div>
                <div id="agentsList" class="max-h-28 overflow-y-auto space-y-1 text-xs text-gray-300">
                    <!-- Dinâmico -->
                </div>
            </div>
        </div>

        <div class="flex-grow pointer-events-none"></div>

        <!-- Barra Inferior Flutuante -->
        <div class="relative z-30 p-4 pb-8 flex justify-center">
            <div class="w-full max-w-lg bg-[#0f172a]/95 border border-cyan-500/30 rounded-3xl px-4 py-3 flex items-center justify-between shadow-[0_0_30px_rgba(6,182,212,0.15)] backdrop-blur-xl">
                
                <button id="toolsBtn" class="p-2 hover:bg-white/5 rounded-full transition text-cyan-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </button>

                <div class="flex-grow px-3">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="Comande o JARVIS (ex: Abrir Spotify)..." 
                        class="bg-transparent text-white placeholder-gray-500 text-sm outline-none w-full"
                    />
                </div>

                <button id="micButton" class="p-2.5 bg-cyan-500/20 border border-cyan-500/40 hover:bg-cyan-500/30 rounded-full transition cursor-pointer group">
                    <svg id="micIcon" class="w-5 h-5 text-cyan-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </button>

            </div>
        </div>

    </div>

    <!-- Script de Execução Frontend -->
    <script>
        const canvas = document.getElementById('neuralCanvas');
        const container = document.getElementById('container');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        const micButton = document.getElementById('micButton');
        const micIcon = document.getElementById('micIcon');
        const agentStatus = document.getElementById('agentStatus');
        const agentResponse = document.getElementById('agentResponse');
        const userInput = document.getElementById('userInput');
        const agentManagerBtn = document.getElementById('agentManagerBtn');
        const agentPanel = document.getElementById('agentPanel');
        const closeAgentPanel = document.getElementById('closeAgentPanel');
        const createAgentBtn = document.getElementById('createAgentBtn');
        const agentNameInput = document.getElementById('agentNameInput');
        const agentsList = document.getElementById('agentsList');
        const statusDot = document.getElementById('statusDot');

        let isListening = false;
        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let mediaStream = null;
        let recognition = null;

        let smoothedVolume = 0;
        let time = 0;
        let agents = [{ id: 1, name: "Spotify Automator", status: "Ativo" }];

        let resizeTimeout;
        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resize, 100);
        });
        resize();

        // Estrutura do Cérebro 3D (Leve e Fluida)
        const particles = [];
        const numParticles = 380;

        for (let i = 0; i < numParticles; i++) {
            let x, y, z;
            let inside = false;
            while (!inside) {
                x = (Math.random() - 0.5) * 2.2;
                y = (Math.random() - 0.5) * 1.5;
                z = (Math.random() - 0.5) * 2.4;
                const eq = (x * x) / 1.0 + (y * y) / 0.55 + (z * z) / 1.4;
                if (eq <= 1.0) {
                    if (Math.abs(x) < 0.08) continue;
                    inside = true;
                }
            }
            const surface = 0.6 + Math.random() * 0.4;
            x *= surface; y *= surface; z *= surface;
            particles.push({ baseX: x, baseY: y, baseZ: z, size: Math.random() * 1.5 + 0.8 });
        }

        const connections = [];
        for (let i = 0; i < particles.length; i++) {
            let count = 0;
            for (let j = i + 1; j < particles.length; j++) {
                if (count > 2) break;
                const dx = particles[i].baseX - particles[j].baseX;
                const dy = particles[i].baseY - particles[j].baseY;
                const dz = particles[i].baseZ - particles[j].baseZ;
                const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
                if (d < 0.28) {
                    connections.push({ a: i, b: j });
                    count++;
                }
            }
        }

        // Sistema de Voz Sintética
        function speakJarvis(text) {
            agentResponse.innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.rate = 1.0;
                utterance.pitch = 0.85; // Tom grave tipo JARVIS
                window.speechSynthesis.speak(utterance);
            }
        }

        // Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                userInput.value = speechResult;
                processJarvisCommand(speechResult);
            };
            recognition.onerror = () => stopListening();
            recognition.onend = () => stopListening();
        }

        micButton.addEventListener('click', async () => {
            if (isListening) {
                stopListening();
                return;
            }
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                
                const source = audioCtx.createMediaStreamSource(mediaStream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                isListening = true;
                micIcon.classList.add('text-pink-500', 'animate-pulse');
                statusDot.className = "w-3 h-3 rounded-full bg-orange-500 animate-ping";
                agentStatus.innerText = "JARVIS A ESCUTAR (MODO FOGO/RAIO)...";

                if (recognition) recognition.start();
                else speakJarvis("Modo de escuta ativo.");
            } catch (err) {
                speakJarvis("Erro ao aceder ao microfone.");
            }
        });

        function stopListening() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            if (recognition) { try { recognition.stop(); } catch(e){} }
            isListening = false;
            smoothedVolume = 0;
            micIcon.classList.remove('text-pink-500', 'animate-pulse');
            statusDot.className = "w-3 h-3 rounded-full bg-cyan-400 animate-ping";
            agentStatus.innerText = "Sistemas Neurais Prontos";
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && userInput.value.trim() !== '') {
                const cmd = userInput.value;
                userInput.value = '';
                processJarvisCommand(cmd);
            }
        });

        function processJarvisCommand(cmd) {
            const lower = cmd.toLowerCase();
            smoothedVolume = 100; // Pico visual de raios/fogo
            if (lower.includes('spotify') || lower.includes('música')) {
                speakJarvis("Rotina do Spotify iniciada com sucesso.");
            } else {
                speakJarvis(`Comando executado: ${cmd}`);
            }
        }

        agentManagerBtn.addEventListener('click', () => { agentPanel.classList.toggle('hidden'); renderAgents(); });
        closeAgentPanel.addEventListener('click', () => agentPanel.classList.add('hidden'));

        createAgentBtn.addEventListener('click', () => {
            const name = agentNameInput.value.trim();
            if(name) {
                agents.push({ id: Date.now(), name: name, status: "Autónomo" });
                agentNameInput.value = '';
                renderAgents();
                speakJarvis(`Novo agente ${name} criado e integrado.`);
            }
        });

        function renderAgents() {
            agentManagerBtn.innerText = `Agentes (${agents.length})`;
            agentsList.innerHTML = agents.map(a => `
                <div class="flex justify-between items-center bg-black/30 p-2 rounded-xl border border-white/5">
                    <span class="font-medium text-cyan-300">${a.name}</span>
                    <span class="text-[10px] text-green-400 bg-green-950/50 px-2 py-0.5 rounded-full">${a.status}</span>
                </div>
            `).join('');
        }

        // Loop Gráfico 3D Otimizado
        function animate() {
            time += 0.02;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            const scale = Math.min(canvas.width, canvas.height) * 0.42;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 20;

            let currentVolume = 0;
            if (isListening && analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                currentVolume = sum / dataArray.length;
            }

            smoothedVolume += (currentVolume - smoothedVolume) * 0.2;
            const volumeScale = smoothedVolume / 40;

            const angleY = time * 0.3;
            const angleX = Math.sin(time * 0.4) * 0.15;
            const sinY = Math.sin(angleY), cosY = Math.cos(angleY);
            const sinX = Math.sin(angleX), cosX = Math.cos(angleX);

            const projected = particles.map(p => {
                const pulse = 1 + (Math.sin(time * 5 + p.baseX) * 0.04) + (volumeScale * 0.3);
                const px = p.baseX * scale * pulse;
                const py = p.baseY * scale * pulse;
                const pz = p.baseZ * scale * pulse;

                const rotX_Y = px * cosY + pz * sinY;
                const rotZ_Y = pz * cosY - px * sinY;
                const finalY = py * cosX - rotZ_Y * sinX;
                const finalZ = rotZ_Y * cosX + py * sinX;
                const finalX = rotX_Y;

                const perspective = 1000 / (1000 - finalZ);
                return {
                    projX: centerX + finalX * perspective,
                    projY: centerY + finalY * perspective,
                    finalZ, perspective, ...p
                };
            });

            ctx.lineWidth = volumeScale > 0.3 ? 1.5 : 0.6;
            for (let i = 0; i < connections.length; i++) {
                const p1 = projected[connections[i].a];
                const p2 = projected[connections[i].b];
                const avgP = (p1.perspective + p2.perspective) / 2;
                if (avgP < 0.6) continue;

                const isFireActive = volumeScale > 0.3;
                const alpha = Math.max(0.03, Math.min(0.4, (avgP - 0.6) * 0.8 + (volumeScale * 0.3)));
                
                ctx.beginPath();
                ctx.moveTo(p1.projX, p1.projY);
                ctx.lineTo(p2.projX, p2.projY);
                ctx.strokeStyle = isFireActive ? `rgba(249, 115, 22, ${alpha * 1.5})` : `rgba(6, 182, 212, ${alpha})`;
                ctx.stroke();
            }

            projected.sort((a, b) => a.finalZ - b.finalZ);
            projected.forEach(p => {
                if (p.perspective < 0.4) return;
                const isFireActive = volumeScale > 0.3;
                const size = Math.max(0.3, p.size * p.perspective * (1 + volumeScale * 0.8));
                
                ctx.beginPath();
                ctx.arc(p.projX, p.projY, size, 0, Math.PI * 2);
                ctx.shadowBlur = isFireActive ? 20 : 8;
                ctx.shadowColor = isFireActive ? '#f97316' : '#22d3ee';
                ctx.fillStyle = isFireActive ? `rgba(251, 146, 60, ${Math.min(1, p.perspective)})` : `rgba(34, 211, 238, ${Math.min(1, p.perspective)})`;
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
