<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // Stark Industries HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;500;700&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background: #010409; overflow: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        ::-webkit-scrollbar { display: none; }
        
        /* Estilo de recortes chanfrados tipo Stark HUD */
        .stark-panel {
            background: rgba(0, 242, 254, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1), 0 0 20px rgba(0, 242, 254, 0.15);
            backdrop-filter: blur(8px);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }
        
        .stark-input-panel {
            background: rgba(1, 10, 20, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between select-none text-[#00f2fe] m-0 p-0">

    <!-- Fundo Holográfico HUD Principal -->
    <canvas id="hudCanvas" class="absolute inset-0 z-0 w-full h-full cursor-grab active:cursor-grabbing"></canvas>

    <!-- Vinheta e Máscara de Ecrã Cibernético -->
    <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_25%,#010409_92%)] z-10"></div>

    <!-- Interface Superior J.A.R.V.I.S. -->
    <header class="relative z-20 px-8 py-6 flex items-center justify-between pointer-events-none">
        <!-- Bloco Esquerdo: Relógio e Telemetria -->
        <div class="stark-panel p-4 flex flex-col gap-1.5 pointer-events-auto min-w-[200px]">
            <div class="flex items-center justify-between">
                <span class="text-[10px] tracking-widest uppercase text-[#00f2fe] font-bold">STARK OS // V4.2.1</span>
                <span class="w-2 h-2 rounded-full bg-[#00f2fe] animate-ping shadow-[0_0_8px_#00f2fe]"></span>
            </div>
            <div id="clockDisplay" class="text-xl font-orbitron font-bold text-white tracking-widest">22:29:57</div>
            <div class="text-[9px] text-cyan-400/70 tracking-wider">ATMOSPHERIC ANALYSIS: 30°C</div>
        </div>

        <!-- Bloco Direito: Biblioteca de Voz e Idioma -->
        <div class="stark-panel p-4 flex flex-col gap-2.5 pointer-events-auto min-w-[240px]">
            <div class="flex items-center justify-between gap-3">
                <span class="text-[10px] text-[#00f2fe] tracking-wider uppercase font-bold">BIBLIOTECA DE VOZ:</span>
                <select id="voiceSelect" class="bg-black/80 text-[#00f2fe] border border-[#00f2fe]/40 rounded px-2 py-1 text-[11px] outline-none cursor-pointer">
                    <option value="jarvis">JARVIS (Grave PT-BR)</option>
                    <option value="friday">FRIDAY (Dinâmica)</option>
                    <option value="ultron">ULTRON (Sintético)</option>
                </select>
            </div>
            <div class="flex items-center justify-between gap-3 pt-1 border-t border-[#00f2fe]/20">
                <span class="text-[10px] text-[#00f2fe] tracking-wider uppercase font-bold">IDIOMA DO SISTEMA:</span>
                <select id="langSelect" class="bg-black/80 text-[#00f2fe] border border-[#00f2fe]/40 rounded px-2 py-1 text-[11px] outline-none cursor-pointer">
                    <option value="pt-BR">Português (Brasil)</option>
                    <option value="en-US">English (US)</option>
                    <option value="es-ES">Español</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Centro: Caixa de Diálogo JARVIS Voice Protocol -->
    <main class="relative z-20 flex-grow flex flex-col items-center justify-center pointer-events-none px-6">
        <div class="stark-panel px-8 py-6 text-center pointer-events-auto max-w-md w-full shadow-[0_0_50px_rgba(0,242,254,0.2)]">
            <div id="protocolLabel" class="text-[10px] tracking-widest text-[#00f2fe] font-bold uppercase mb-2">JARVIS VOICE PROTOCOL</div>
            <p id="voiceFeedback" class="text-xs md:text-sm font-light text-gray-200 tracking-wider leading-relaxed">
                "Diretiva executada e processada pelos sub-agentes."
            </p>
        </div>
    </main>

    <!-- Rodapé: Input & Mic com Design J.A.R.V.I.S. -->
    <footer class="relative z-30 p-8 flex justify-center pointer-events-auto">
        <div class="stark-input-panel w-full max-w-lg p-3 flex items-center gap-3">
            <input 
                type="text" 
                id="textInput" 
                placeholder="Insira diretiva (ex: 'Criar agente', 'Mudar cor')..." 
                class="bg-transparent text-[#00f2fe] placeholder-cyan-900/60 text-xs outline-none flex-grow px-3 font-tech"
            />
            <button id="micBtn" class="p-3 bg-[#00f2fe]/10 border border-[#00f2fe]/50 hover:bg-[#00f2fe]/25 text-[#00f2fe] rounded-xl transition flex items-center justify-center group cursor-pointer shadow-[0_0_15px_rgba(0,242,254,0.3)]" title="Ativar Microfone">
                <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Lógica e Animação Holográfica 60 FPS -->
    <script>
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');
        const clockDisplay = document.getElementById('clockDisplay');
        const voiceSelect = document.getElementById('voiceSelect');
        const langSelect = document.getElementById('langSelect');
        const protocolLabel = document.getElementById('protocolLabel');

        let isListening = false;
        let speechRecognition = null;
        let speechSynth = window.speechSynthesis;
        let hudEnergy = 0;
        let angleTicker = 0;
        
        let currentLang = 'pt-BR';
        let currentVoiceProfile = 'jarvis';

        const translations = {
            'pt-BR': {
                protocol: "JARVIS VOICE PROTOCOL",
                welcome: "Diretiva executada e processada pelos sub-agentes.",
                listening: "À sua escuta, Sr. Stark.",
                executing: "Analisando diretiva. Executando rotinas.",
                success: "Diretiva executada com sucesso.",
                placeholder: "Insira diretiva (ex: 'Criar agente', 'Mudar cor')..."
            },
            'en-US': {
                protocol: "JARVIS VOICE PROTOCOL",
                welcome: "Directive executed and processed by sub-agents.",
                listening: "Listening, Mr. Stark.",
                executing: "Analyzing directive. Executing routines.",
                success: "Directive executed successfully.",
                placeholder: "Enter directive (e.g., 'Create agent', 'Change color')..."
            },
            'es-ES': {
                protocol: "JARVIS VOICE PROTOCOL",
                welcome: "Directiva ejecutada y procesada por los subagentes.",
                listening: "A la escucha, Sr. Stark.",
                executing: "Analizando directiva. Ejecutando rutinas.",
                success: "Directiva ejecutada con éxito.",
                placeholder: "Ingrese directiva (ej: 'Crear agente', 'Cambiar color')..."
            }
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        setInterval(() => {
            const now = new Date();
            clockDisplay.innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            const t = translations[currentLang];
            protocolLabel.innerText = t.protocol;
            voiceFeedback.innerText = `"${t.welcome}"`;
            textInput.placeholder = t.placeholder;
            if (speechRecognition) speechRecognition.lang = currentLang;
        });

        voiceSelect.addEventListener('change', (e) => {
            currentVoiceProfile = e.target.value;
            speakJarvis(translations[currentLang].welcome);
        });

        function speakJarvis(text) {
            voiceFeedback.innerText = `"${text}"`;
            if (speechSynth) {
                speechSynth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = currentLang;
                if (currentVoiceProfile === 'jarvis') {
                    utter.rate = 0.95;
                    utter.pitch = 0.4;
                } else if (currentVoiceProfile === 'friday') {
                    utter.rate = 1.05;
                    utter.pitch = 1.2;
                } else {
                    utter.rate = 0.85;
                    utter.pitch = 0.1;
                }
                speechSynth.speak(utter);
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SR();
            speechRecognition.lang = currentLang;
            speechRecognition.onresult = (e) => {
                const query = e.results[0][0].transcript;
                textInput.value = query;
                executeAgentTask(query);
            };
            speechRecognition.onend = () => stopMic();
        }

        let audioCtx = null, analyser = null, micStream = null;
        micBtn.addEventListener('click', async () => {
            if (isListening) {
                stopMic();
                return;
            }
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                const source = audioCtx.createMediaStreamSource(micStream);
                source.connect(analyser);

                isListening = true;
                micBtn.classList.add('bg-cyan-500/30', 'border-cyan-400', 'text-white');
                speakJarvis(translations[currentLang].listening);
                if (speechRecognition) speechRecognition.start();
            } catch (err) {
                speakJarvis("Erro nos sensores de áudio.");
            }
        });

        function stopMic() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            if (speechRecognition) { try { speechRecognition.stop(); } catch(e){} }
            isListening = false;
            hudEnergy = 0;
            micBtn.classList.remove('bg-cyan-500/30', 'border-cyan-400', 'text-white');
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && textInput.value.trim() !== '') {
                const val = textInput.value;
                textInput.value = '';
                executeAgentTask(val);
            }
        });

        function executeAgentTask(directive) {
            hudEnergy = 100;
            const t = translations[currentLang];
            speakJarvis(t.executing);

            setTimeout(() => {
                speakJarvis(t.success);
            }, 1200);
        }

        // Renderização do HUD Holográfico Circular Estilo Stark
        function renderStarkHUD() {
            angleTicker += 0.015;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#010409';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.42;

            hudEnergy *= 0.95;

            // Anel Externo Tracejado Rotativo
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2fe';

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angleTicker * 0.4);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.3, 0, Math.PI * 2);
            ctx.setLineDash([8, 12, 4, 12]);
            ctx.stroke();
            ctx.restore();

            // Anel Intermediário Inverso
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(-angleTicker * 0.6);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.95, 0, Math.PI * 1.5);
            ctx.setLineDash([3, 6]);
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();

            // Núcleo Reator Central Pulsante
            ctx.beginPath();
            ctx.arc(centerX, centerY, (radius * 0.28) * (1 + hudEnergy * 0.003), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 242, 254, 0.2)';
            ctx.fill();
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            requestAnimationFrame(renderStarkHUD);
        }

        renderStarkHUD();
    </script>
</body>
</html>
