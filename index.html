<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // Robust Voice Intent Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;500;700&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background: #000205; overflow-x: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(1, 4, 9, 0.9); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.4); border-radius: 2px; }
        
        .stark-panel {
            background: rgba(0, 242, 254, 0.04);
            border: 1px solid rgba(0, 242, 254, 0.5);
            box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.12), 0 0 25px rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(12px);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }
        
        .stark-input-panel {
            background: rgba(1, 10, 20, 0.95);
            border: 1px solid rgba(0, 242, 254, 0.7);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.35);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 15px 100%, 0 calc(100% - 12px));
        }
    </style>
</head>
<body class="min-h-screen w-screen overflow-x-hidden flex flex-col justify-between select-none text-[#00f2fe] m-0 p-0">

    <!-- Canvas HUD Neural com Fundo de Rede Neuronal Viva -->
    <canvas id="hudCanvas" class="fixed inset-0 z-0 w-full h-full pointer-events-none"></canvas>

    <!-- Vinheta Cinemática -->
    <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_15%,#000205_92%)] z-10"></div>

    <!-- Header Superior com Controlo Admin -->
    <header class="relative z-20 p-4 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-none w-full max-w-7xl mx-auto">
        <div class="stark-panel p-3.5 flex flex-col gap-2 pointer-events-auto w-full sm:w-64">
            <div class="flex items-center justify-between">
                <span class="text-[10px] tracking-widest uppercase text-[#00f2fe] font-bold">STARK OS // ROBUST VOICE</span>
                <span id="systemPulseDot" class="w-2 h-2 rounded-full bg-[#00f2fe] animate-ping shadow-[0_0_10px_#00f2fe]"></span>
            </div>
            <div id="clockDisplay" class="text-lg font-orbitron font-bold text-white tracking-widest">00:00:00</div>
            <div class="text-[9px] text-cyan-400/80 tracking-wider">CHEFIA: <strong id="adminUserLabel" class="text-white">Fagundes</strong></div>
        </div>

        <div class="stark-panel p-3.5 flex flex-col gap-2 pointer-events-auto w-full sm:w-80">
            <div class="flex items-center justify-between text-[10px] uppercase font-bold tracking-wider">
                <span class="text-[#00f2fe]">SUB-AGENTES ROBUSTOS</span>
                <span id="agentCountBadge" class="text-emerald-400">4 ATIVOS</span>
            </div>
            <div class="flex gap-2">
                <input type="text" id="newAgentName" placeholder="Nome (ex: Linker App)" class="bg-black/80 text-[#00f2fe] border border-[#00f2fe]/40 rounded px-2 py-1 text-[11px] outline-none flex-grow font-mono" />
                <button id="createAgentBtn" class="bg-[#00f2fe]/20 hover:bg-[#00f2fe]/40 border border-[#00f2fe] text-white px-2.5 py-1 rounded text-[11px] font-bold transition cursor-pointer">Criar</button>
            </div>
            <div id="agentsListContainer" class="max-h-20 overflow-y-auto space-y-1 text-[10px] text-gray-300 font-mono pr-1">
                <!-- Injetado dinamicamente -->
            </div>
        </div>
    </header>

    <!-- Centro: Diálogo JARVIS e Workspace Dinâmico -->
    <main class="relative z-20 flex-grow flex flex-col items-center justify-center pointer-events-none px-4 sm:px-6 py-4 my-auto gap-4 w-full max-w-4xl mx-auto">
        <div class="stark-panel px-6 py-5 text-center pointer-events-auto w-full shadow-[0_0_40px_rgba(0,242,254,0.2)]">
            <div id="protocolLabel" class="text-[10px] tracking-widest text-[#00f2fe] font-bold uppercase mb-1">JARVIS ROBUST INTENT BRIDGE</div>
            <p id="voiceFeedback" class="text-xs sm:text-sm font-light text-gray-200 tracking-wider leading-relaxed font-mono">
                "Reconhecimento de voz robusto ativo. Fale ou digite qualquer comando ou app, Fagundes."
            </p>
        </div>

        <!-- Área de Trabalho Dinâmica Gerida pelos Agentes -->
        <div id="dynamicPlatform" class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3 pointer-events-auto max-h-[35vh] overflow-y-auto pr-1">
            <div class="stark-panel p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[11px] font-bold text-[#00f2fe] uppercase tracking-wider">Robust Intent Engine</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                </div>
                <p class="text-[11px] text-gray-300 font-light">Mapeamento inteligente de palavras-chave por áudio e texto.</p>
            </div>
        </div>
    </main>

    <!-- Rodapé: Controlo de Voz e Texto -->
    <footer class="relative z-30 p-4 sm:p-8 flex justify-center pointer-events-auto w-full max-w-3xl mx-auto">
        <div class="stark-input-panel w-full p-2.5 sm:p-3 flex items-center gap-3">
            <input 
                type="text" 
                id="textInput" 
                placeholder="Insira diretiva (ex: 'Abrir YouTube', 'Pesquisar notícias')..." 
                class="bg-transparent text-[#00f2fe] placeholder-cyan-900/60 text-xs sm:text-sm outline-none flex-grow px-3 font-tech"
            />
            <button id="micBtn" class="p-2.5 sm:p-3 bg-[#00f2fe]/15 border border-[#00f2fe]/60 hover:bg-[#00f2fe]/30 text-[#00f2fe] rounded-xl transition flex items-center justify-center group cursor-pointer shadow-[0_0_20px_rgba(0,242,254,0.4)] shrink-0" title="Ativar Microfone">
                <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Lógica de Reconhecimento Robusto e Abertura Automática -->
    <script>
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');
        const clockDisplay = document.getElementById('clockDisplay');
        const newAgentName = document.getElementById('newAgentName');
        const createAgentBtn = document.getElementById('createAgentBtn');
        const agentsListContainer = document.getElementById('agentsListContainer');
        const agentCountBadge = document.getElementById('agentCountBadge');
        const dynamicPlatform = document.getElementById('dynamicPlatform');
        const adminUserLabel = document.getElementById('adminUserLabel');
        const systemPulseDot = document.getElementById('systemPulseDot');

        let isListening = false;
        let speechRecognition = null;
        let speechSynth = window.speechSynthesis;
        let hudEnergy = 0;
        let angleTicker = 0;

        let currentAdminName = localStorage.getItem('jarvis_admin_name') || "Fagundes";
        adminUserLabel.innerText = currentAdminName;

        let internalAgents = [
            { id: 1, name: "Orquestrador Kernel", status: "Executando" },
            { id: 2, name: "Executor de DOM", status: "Ativo" },
            { id: 3, name: "Robust Voice Bridge", status: "Pronto" },
            { id: 4, name: "Neural Voice Core", status: "Ativo" }
        ];

        const neuralNodes = [];
        for (let i = 0; i < 45; i++) {
            neuralNodes.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                radius: Math.random() * 2 + 1.5
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        setInterval(() => {
            const now = new Date();
            clockDisplay.innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        function renderAgentsUI() {
            agentCountBadge.innerText = `${internalAgents.length} ATIVOS`;
            agentsListContainer.innerHTML = internalAgents.map(a => `
                <div class="flex justify-between items-center bg-black/60 p-1.5 rounded border border-cyan-500/20">
                    <span class="text-cyan-300 font-bold">${a.name}</span>
                    <span class="text-emerald-400 text-[9px]">${a.status}</span>
                </div>
            `).join('');
        }
        renderAgentsUI();

        let selectedVoice = null;
        function loadVoices() {
            const voices = speechSynth.getVoices();
            selectedVoice = voices.find(v => v.lang.includes('pt') && (v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('antonio') || v.name.toLowerCase().includes('lucas') || v.name.toLowerCase().includes('male'))) || voices.find(v => v.lang.includes('pt')) || voices[0];
        }
        if (speechSynth.onvoiceschanged !== undefined) {
            speechSynth.onvoiceschanged = loadVoices;
        }
        loadVoices();

        function speakJarvis(text) {
            voiceFeedback.innerText = `"${text}"`;
            if (speechSynth) {
                speechSynth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                if (selectedVoice) utter.voice = selectedVoice;
                utter.lang = 'pt-BR';
                utter.rate = 0.95;
                utter.pitch = 0.45;
                speechSynth.speak(utter);
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SR();
            speechRecognition.lang = 'pt-BR';
            speechRecognition.continuous = false;
            speechRecognition.interimResults = false;
            speechRecognition.onresult = (e) => {
                const query = e.results[0][0].transcript;
                textInput.value = query;
                executeAutonomousCommand(query);
            };
            speechRecognition.onerror = () => stopMic();
            speechRecognition.onend = () => stopMic();
        }

        let audioCtx = null, analyser = null, micStream = null;
        micBtn.addEventListener('click', async () => {
            if (isListening) {
                stopMic();
                return;
            }
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                const source = audioCtx.createMediaStreamSource(micStream);
                source.connect(analyser);

                isListening = true;
                micBtn.classList.add('bg-red-500/40', 'border-red-400', 'text-white', 'shadow-[0_0_30px_#ff3d00]');
                systemPulseDot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping shadow-[0_0_15px_#ff3d00]";
                speakJarvis(`Escutando, ${currentAdminName}. Pode falar.`);
                if (speechRecognition) speechRecognition.start();
            } catch (err) {
                speakJarvis("Erro nos sensores de áudio.");
            }
        });

        function stopMic() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            if (speechRecognition) { try { speechRecognition.stop(); } catch(e){} }
            isListening = false;
            hudEnergy = 0;
            micBtn.classList.remove('bg-red-500/40', 'border-red-400', 'text-white', 'shadow-[0_0_30px_#ff3d00]');
            systemPulseDot.className = "w-2 h-2 rounded-full bg-[#00f2fe] animate-ping shadow-[0_0_10px_#00f2fe]";
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && textInput.value.trim() !== '') {
                const val = textInput.value;
                textInput.value = '';
                executeAutonomousCommand(val);
            }
        });

        createAgentBtn.addEventListener('click', () => {
            const name = newAgentName.value.trim();
            if (name) {
                registerNewAgent(name, "Em Execução");
                newAgentName.value = '';
            }
        });

        function registerNewAgent(agentName, statusDesc) {
            const cleanName = agentName.replace(/["']/g, "").trim();
            internalAgents.push({ id: internalAgents.length + 1, name: cleanName, status: statusDesc });
            renderAgentsUI();
            spawnPlatformWidget(`Agente ${cleanName}`, `Sub-agente operacional instanciado com sucesso.`);
            speakJarvis(`Sub-agente ${cleanName} criado e ativado com sucesso.`);
        }

        // --- MOTOR DE ANÁLISE ROBUSTA DE INTENTS (VOZ E TEXTO) ---
        function executeAutonomousCommand(directive) {
            hudEnergy = 100;
            const lower = directive.toLowerCase().trim();

            // 1. Mudar Nome do Administrador
            if (lower.includes('mudar nome') || lower.includes('chame de') || lower.includes('nome para')) {
                let parts = directive.split(/para|de/i);
                if (parts.length > 1) {
                    currentAdminName = parts[parts.length - 1].trim().replace(/[.!?,]/g, '');
                    localStorage.setItem('jarvis_admin_name', currentAdminName);
                    adminUserLabel.innerText = currentAdminName;
                    spawnPlatformWidget("Perfil Atualizado", `Nome administrativo alterado para ${currentAdminName}`);
                    speakJarvis(`Nome atualizado para ${currentAdminName}. Pronto, chefe.`);
                    return;
                }
            }

            // 2. Criar Agente
            if (lower.includes('criar agente') || lower.includes('novo agente')) {
                let parts = directive.split(/agente/i);
                let extractedName = parts[1] ? parts[1].trim() : `Auto #${internalAgents.length + 1}`;
                if (!extractedName || extractedName.length < 2) {
                    extractedName = `Executor #${internalAgents.length + 1}`;
                }
                registerNewAgent(extractedName, "Em Operação");
                return;
            }

            // 3. Abertura Automática por Palavras-Chave (Funciona perfeitamente por Voz ou Texto)
            let targetUrl = "";
            let targetName = "";

            if (lower.includes('spotify') || lower.includes('música') || lower.includes('musica') || lower.includes('ouvir')) {
                targetName = "Spotify";
                targetUrl = "https://open.spotify.com";
            } else if (lower.includes('gmail') || lower.includes('email') || lower.includes('e-mail')) {
                targetName = "Gmail";
                targetUrl = "https://mail.google.com";
            } else if (lower.includes('youtube')) {
                targetName = "YouTube";
                targetUrl = "https://youtube.com";
            } else if (lower.includes('maps') || lower.includes('gps') || lower.includes('localização')) {
                targetName = "Google Maps";
                targetUrl = "https://maps.google.com";
            } else if (lower.includes('whatsapp')) {
                targetName = "WhatsApp";
                targetUrl = "https://web.whatsapp.com";
            } else if (lower.includes('abrir') || lower.includes('pesquisar') || lower.includes('buscar') || lower.includes('procurar')) {
                // Remove termos de preenchimento e pega o termo alvo da pesquisa
                let cleanQuery = directive.replace(/abrir|pesquisar|buscar|procurar|no|o|a|os|as|por|para|meu|o|favor|jarvis/gi, '').trim();
                targetName = `Busca: ${cleanQuery}`;
                targetUrl = `https://www.google.com/search?q=${encodeURIComponent(cleanQuery)}`;
            }

            if (targetUrl) {
                speakJarvis(`A abrir ${targetName}.`);
                spawnPlatformWidget(`Ação Automática`, `Executando diretiva para ${targetName}...`);
                setTimeout(() => {
                    window.open(targetUrl, "_blank");
                }, 500);
                return;
            }

            // Ação padrão se não for comando de app
            speakJarvis(`Diretiva processada: ${directive}.`);
            spawnPlatformWidget("Tarefa Executada", directive);
        }

        function spawnPlatformWidget(title, content) {
            const card = document.createElement('div');
            card.className = "stark-panel p-4 flex flex-col justify-between animate-[fadeIn_0.4s_ease-out]";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[11px] font-bold text-[#00f2fe] uppercase tracking-wider">${title}</span>
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                </div>
                <p class="text-[11px] text-gray-300 font-light">${content}</p>
                <div class="mt-3 flex justify-between items-center text-[9px] font-mono text-cyan-400/70">
                    <span>STATUS: EXECUTADO</span>
                    <span>ROBUST BRIDGE</span>
                </div>
            `;
            dynamicPlatform.prepend(card);
        }

        function renderStarkHUD() {
            angleTicker += 0.02;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            const primaryColor = isListening ? '255, 61, 0' : '0, 242, 254';
            const secondaryGlow = isListening ? '#ff3d00' : '#00f2fe';

            ctx.lineWidth = 0.8;
            for (let i = 0; i < neuralNodes.length; i++) {
                let n = neuralNodes[i];
                n.x += n.vx;
                n.y += n.vy;

                if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
                if (n.y < 0 || n.y > canvas.height) n.vy *= -1;

                for (let j = i + 1; j < neuralNodes.length; j++) {
                    let n2 = neuralNodes[j];
                    let dx = n.x - n2.x;
                    let dy = n.y - n2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(n.x, n.y);
                        ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = `rgba(${primaryColor}, ${1 - dist / 130})`;
                        ctx.stroke();
                    }
                }

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${primaryColor}, 0.7)`;
                ctx.fill();
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.42;

            hudEnergy *= 0.95;

            ctx.strokeStyle = `rgb(${primaryColor})`;
            ctx.lineWidth = 2.5;
            ctx.shadowBlur = isListening ? 25 : 15;
            ctx.shadowColor = secondaryGlow;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angleTicker * 0.6);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.3, 0, Math.PI * 2);
            ctx.setLineDash([12, 18, 6, 18]);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(-angleTicker * 0.9);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.95, 0, Math.PI * 1.6);
            ctx.setLineDash([5, 10]);
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(centerX, centerY, (radius * 0.3) * (1 + (isListening ? Math.sin(angleTicker * 8) * 0.15 : 0)), 0, Math.PI * 2);
            ctx.fillStyle = isListening ? 'rgba(255, 61, 0, 0.35)' : 'rgba(0, 242, 254, 0.25)';
            ctx.fill();
            ctx.strokeStyle = `rgb(${primaryColor})`;
            ctx.lineWidth = 4;
            ctx.stroke();

            requestAnimationFrame(renderStarkHUD);
        }

        renderStarkHUD();
    </script>
</body>
</html>
