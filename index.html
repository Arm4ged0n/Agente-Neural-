<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // Stark Industries HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background: #010409; overflow: hidden; }
        .font-tech { font-family: 'Share Tech Mono', monospace; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between select-none text-[#00f2fe] m-0 p-0">

    <!-- Fundo Holográfico HUD Principal -->
    <canvas id="hudCanvas" class="absolute inset-0 z-0 w-full h-full cursor-grab active:cursor-grabbing"></canvas>

    <!-- Vinheta e Máscara de Ecrã Cibernético -->
    <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_30%,#010409_95%)] z-10"></div>

    <!-- Interface Estilo Stark HUD (Margens com Telemetria) -->
    <header class="relative z-20 px-8 py-6 flex items-center justify-between pointer-events-none">
        <!-- Canto Superior Esquerdo: Data / Hora / Sistema -->
        <div class="flex flex-col gap-1 bg-black/40 border border-[#00f2fe]/30 p-3 rounded-xl backdrop-blur-md pointer-events-auto shadow-[0_0_15px_rgba(0,242,254,0.15)] font-tech">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#00f2fe] animate-ping"></span>
                <span class="text-xs uppercase tracking-widest text-[#00f2fe]">STARK OS // V4.2.1</span>
            </div>
            <div id="clockDisplay" class="text-lg font-bold text-white tracking-wider">22:17:10</div>
            <div class="text-[10px] text-gray-400">ATMOSPHERIC ANALYSIS: 30°C</div>
        </div>

        <!-- Canto Superior Direito: Sub-Agentes Ativos -->
        <div class="hidden sm:flex flex-col items-end gap-1 font-tech text-xs text-gray-300 pointer-events-auto bg-black/40 border border-[#00f2fe]/30 p-3 rounded-xl backdrop-blur-md">
            <span class="text-[#00f2fe] font-bold">MULTI-AGENT MATRIX</span>
            <span id="activeAgentState" class="text-emerald-400">● AGENTE ORQUESTRADOR: ATIVO</span>
        </div>
    </header>

    <!-- Centro: Núcleo Holográfico Circundante & Resposta de Voz/Agente -->
    <main class="relative z-20 flex-grow flex flex-col items-center justify-center pointer-events-none px-6">
        <div class="text-center pointer-events-auto bg-black/80 border border-[#00f2fe]/40 px-8 py-5 rounded-3xl backdrop-blur-xl shadow-[0_0_40px_rgba(0,242,254,0.25)] max-w-lg w-full">
            <div class="text-[10px] font-tech text-[#00f2fe] tracking-widest uppercase mb-1">JARVIS VOICE PROTOCOL</div>
            <p id="voiceFeedback" class="text-xs md:text-sm font-light text-gray-200 tracking-wider font-tech leading-relaxed">
                "Sistemas e sub-agentes integrados. Posso ler, criar e executar tarefas no código desta plataforma. O que deseja comandar, Sr. Stark?"
            </p>
        </div>
    </main>

    <!-- Rodapé: Controlo por Voz e Texto com Controlo Total do Código -->
    <footer class="relative z-30 p-8 flex justify-center pointer-events-auto">
        <div class="w-full max-w-lg bg-black/85 border border-[#00f2fe]/40 rounded-2xl p-2.5 flex items-center gap-3 backdrop-blur-2xl shadow-[0_0_30px_rgba(0,242,254,0.2)]">
            <input 
                type="text" 
                id="textInput" 
                placeholder="Insira diretiva (ex: 'Criar agente leitor', 'Mudar cor para vermelho')..." 
                class="bg-transparent text-[#00f2fe] placeholder-cyan-900/60 text-xs font-tech outline-none flex-grow px-3"
            />
            <button id="micBtn" class="p-3 bg-[#00f2fe]/10 border border-[#00f2fe]/40 hover:bg-[#00f2fe]/20 text-[#00f2fe] rounded-xl transition flex items-center justify-center group cursor-pointer" title="Ativar Microfone">
                <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Lógica do Agente Mestre com Controlo de Código e Voz pt-BR -->
    <script>
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');
        const clockDisplay = document.getElementById('clockDisplay');
        const activeAgentState = document.getElementById('activeAgentState');

        let isListening = false;
        let speechRecognition = null;
        let speechSynth = window.speechSynthesis;
        let audioCtx = null, analyser = null, dataArray = null, micStream = null;

        let hudEnergy = 0;
        let angleTicker = 0;
        let internalAgents = [
            { id: 1, name: "Orquestrador", role: "Gestão de Conversação e Sub-tarefas" },
            { id: 2, name: "Executor de DOM", role: "Leitura, Modificação e Execução de Tarefas" }
        ];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Relógio em tempo real
        setInterval(() => {
            const now = new Date();
            clockDisplay.innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        // Sintetizador de Voz (Português do Brasil, Tom Grave tipo JARVIS)
        function speakJarvis(text) {
            voiceFeedback.innerText = `"${text}"`;
            if (speechSynth) {
                speechSynth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'pt-BR';
                utter.rate = 1.0;
                utter.pitch = 0.7; // Voz masculina grave
                speechSynth.speak(utter);
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SR();
            speechRecognition.lang = 'pt-BR';
            speechRecognition.onresult = (e) => {
                const query = e.results[0][0].transcript;
                textInput.value = query;
                executeAgentTask(query);
            };
            speechRecognition.onend = () => stopMic();
        }

        micBtn.addEventListener('click', async () => {
            if (isListening) {
                stopMic();
                return;
            }
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                const source = audioCtx.createMediaStreamSource(micStream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                isListening = true;
                micBtn.classList.add('bg-cyan-500/20', 'border-cyan-500/40', 'text-cyan-300');
                speakJarvis("À sua escuta, Sr. Stark.");
                if (speechRecognition) speechRecognition.start();
            } catch (err) {
                speakJarvis("Erro nos sensores de áudio.");
            }
        });

        function stopMic() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            if (speechRecognition) { try { speechRecognition.stop(); } catch(e){} }
            isListening = false;
            hudEnergy = 0;
            micBtn.classList.remove('bg-cyan-500/20', 'border-cyan-500/40', 'text-cyan-300');
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && textInput.value.trim() !== '') {
                const val = textInput.value;
                textInput.value = '';
                executeAgentTask(val);
            }
        });

        // --- SISTEMA DE CONTROLO AUTÓNOMO DE CÓDIGO E TAREFAS ---
        function executeAgentTask(directive) {
            hudEnergy = 100; // Pico visual no HUD
            const lower = directive.toLowerCase();

            activeAgentState.innerText = "● EXECUTANDO TAREFA NO CÓDIGO...";
            speakJarvis(`Analisando diretiva: "${directive}". Executando rotinas.`);

            setTimeout(() => {
                if (lower.includes('criar agente') || lower.includes('novo agente')) {
                    const agentName = `Sub-Agente ${internalAgents.length + 1}`;
                    internalAgents.push({ id: internalAgents.length + 1, name: agentName, role: directive });
                    activeAgentState.innerText = `● AGENTE CRIADO: ${agentName}`;
                    speakJarvis(`Novo agente instanciado e integrado na matriz com sucesso.`);
                } 
                else if (lower.includes('cor') || lower.includes('vermelho') || lower.includes('estilo')) {
                    document.body.style.filter = "hue-rotate(180deg)";
                    activeAgentState.innerText = "● MUTAÇÃO DE DOM APLICADA";
                    speakJarvis("Parâmetros visuais do código modificados conforme solicitado.");
                } 
                else {
                    activeAgentState.innerText = "● TAREFA EXECUTADA COM SUCESSO";
                    speakJarvis(`Diretiva executada e processada pelos sub-agentes.`);
                }
            }, 1500);
        }

        // Renderização do HUD Holográfico Circular
        function renderStarkHUD() {
            angleTicker += 0.015;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#010409';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.45;

            let curVol = 0;
            if (isListening && analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                curVol = sum / dataArray.length;
            }

            hudEnergy += (curVol - hudEnergy) * 0.2;
            const energyScale = hudEnergy / 40;

            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15 + (energyScale * 10);
            ctx.shadowColor = '#00f2fe';

            // Anel Externo Rotativo
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angleTicker * 0.5);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.2, 0, Math.PI * 2);
            ctx.setLineDash([10, 15, 5, 15]);
            ctx.stroke();
            ctx.restore();

            // Anel Central Inverso
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(-angleTicker * 0.8);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.85, 0, Math.PI * 1.5);
            ctx.setLineDash([4, 8]);
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();

            // Núcleo Reator Central
            ctx.beginPath();
            ctx.arc(centerX, centerY, (radius * 0.3) * (1 + energyScale * 0.2), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 242, 254, 0.25)';
            ctx.fill();
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 4;
            ctx.stroke();

            requestAnimationFrame(renderStarkHUD);
        }

        renderStarkHUD();
    </script>
</body>
</html>
